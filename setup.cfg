[flake8]
max-line-length = 100
# ignore blank line contains whitespace - useful for docstrings
ignore = W293
exclude =
    .git,
    __pycache__,
    build,
    dist

[tool:pytest]
markers =
    extended_power: native power accuracy and project-package validation
testpaths =
    tests
    demos/integrations
norecursedirs =
    .git
    .venv
    build
    dist
    worktrees
