minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false

ci:
  # Each autoupdate pull request runs the full test and merge-queue tiers, so hook bumps come once a quarter.
  autoupdate_schedule: quarterly
  skip:
    - black
    - crosstl-ci-workflow-tests
    - crosstl-pytest-failure-summary-tests
    - crosstl-examples-script-tests

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=4096]
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.patch$
      - id: trailing-whitespace
        # Upstream patch context must stay byte-exact.
        exclude: \.patch$
        args:
          - --markdown-linebreak-ext=md
          - --markdown-linebreak-ext=rst

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        name: ruff critical Python checks
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --select=E9,F63,F7,F82
          - --target-version=py38

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py38-plus]

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args:
          - --profile=black
          - --filter-files

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        args:
          - --preview
          - --target-version=py38

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --ignore-init-module-imports

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: crosstl-ci-workflow-tests
        name: CrossTL CI workflow tests
        entry: python -m pytest -q tests/test_ci_workflows.py tests/test_workflow_text.py tests/test_metal_toolchain_setup.py tests/test_tool_cli.py tests/test_demo_layout.py tests/test_compile_artifact_bundle.py tests/test_ci_helpers.py demos/integrations/mlx/tests/test_ci.py demos/integrations/mlx/tests/test_ci_native_selection.py
        language: python
        additional_dependencies: [pytest, hypothesis, numpy, "PyYAML>=6,<7"]
        pass_filenames: false
        files: ^(\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml|actionlint\.yaml)|tools/(compile_artifact_bundle|ensure_metal_toolchain|refresh_artifact_contract|pytest_failure_summary)\.py|tests/(ci_helpers|workflow_text|test_ci_helpers|test_compile_artifact_bundle|test_metal_toolchain_setup|test_ci_workflows|test_workflow_text|test_tool_cli|test_demo_layout)\.py|demos/integrations/.*/tests/test_ci(_native_selection)?\.py)$

      - id: crosstl-pytest-failure-summary-tests
        name: CrossTL pytest failure summary tests
        entry: python -m pytest -q tests/test_pytest_failure_summary.py
        language: python
        additional_dependencies: [pytest, hypothesis, numpy]
        pass_filenames: false
        files: ^(tools/pytest_failure_summary\.py|tests/test_pytest_failure_summary\.py)$

      - id: crosstl-examples-script-tests
        name: CrossTL examples script tests
        entry: python -m pytest -q tests/test_examples_test_script.py
        language: python
        additional_dependencies: [pytest, hypothesis, numpy]
        pass_filenames: false
        files: ^(examples/test\.py|tests/test_examples_test_script\.py|\.github/workflows/examples-test\.yml)$

      - id: crosstl-docs-build
        name: CrossTL documentation build
        entry: make -C docs html
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: crosstl-full-test-suite
        name: CrossTL full pytest suite
        entry: python -m pytest tests demos/integrations -q -n auto
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
