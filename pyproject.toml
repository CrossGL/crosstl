[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "crosstl"
version = "3.4.0"
description = "Translate GPU shaders and compute kernels between languages through the CrossGL IR"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "CrossGL team", email = "nripesh@crossgl.net"}]
dependencies = ["gast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://crossgl.net/"
Documentation = "https://docs.crossgl.net/products/crossgl-translator/index.html"
Source = "https://github.com/CrossGL/crosstl"
Issues = "https://github.com/CrossGL/crosstl/issues"
Changelog = "https://github.com/CrossGL/crosstl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
directx-runtime = ["compushady>=0.17.5,<0.18; platform_system=='Windows'"]
test = ["hypothesis>=6.82", "numpy", "pytest", "pytest-xdist", "PyYAML>=6,<7"]

[project.scripts]
crosstl = "crosstl._crosstl:main"

[tool.pytest.ini_options]
markers = ["extended_power: native power accuracy and project-package validation"]
testpaths = ["tests", "demos/integrations"]
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", "worktrees"]

[tool.flit.sdist]
include = ["CHANGELOG.md", "CITATION.cff", ".zenodo.json", "examples/", "docs/"]
exclude = ["docs/_build/", "examples/output/", "**/__pycache__/", "**/*.py[cod]"]
