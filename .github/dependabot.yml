version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      github-actions:
        patterns:
          - "*"
  # Python dependencies get security updates only; this entry sets their labels.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies]
  # Likewise for the NuGet packages of the ComputeSharp demo. Its portable runtime
  # must resolve the ImageSharp version pinned by the upstream ComputeSharp commit;
  # see demos/integrations/computesharp/README.md, "Pinned Dependency Exceptions".
  - package-ecosystem: nuget
    directories:
      - /demos/integrations/computesharp/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies]
    ignore:
      - dependency-name: SixLabors.ImageSharp
