- name: area:ci
  color: 1d76db
  description: Workflows, tests and coverage tooling
  paths:
    - ".github/workflows/*"
    - ".github/actions/*"
    - ".github/actionlint.yaml"
    - ".pre-commit-config.yaml"
    - tools/coverage/*
    - tests/coverage/*
- name: area:docs
  color: 1d76db
