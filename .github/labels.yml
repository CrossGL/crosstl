# Repository labels. The Labels workflow makes GitHub match this file on every
# push to main: it creates and updates the labels listed here and deletes all
# others. `renamed-from` keeps a label on its issues when its name changes.
#
# Every hour it also labels each open pull request that has no labels yet with
# the labels whose `paths` match a file the pull request changes. Patterns are
# fnmatch globs, lower case, matched against lower-cased paths; `*` also
# matches `/`. A backend label matches its names as whole words of a path under
# crosstl/ or tests/: `tests*[/_-]hip[/_.-]*` matches tests/test_cuda_hip_x.py
# but not tests/test_ownership.py. A pull request is labelled only once, so
# labels set by hand stay.

- name: bug
  color: d73a4a
  description: Wrong output, a crash or a regression
- name: enhancement
  color: a2eeef
  description: New feature or improvement
- name: documentation
  color: 0075ca
  description: Documentation changes
- name: question
  color: d876e3
  description: Usage question; prefer Discussions
- name: good first issue
  color: 7057ff
  description: Small, well-scoped task for a new contributor
- name: help wanted
  color: 008672
  description: Maintainers would welcome a contribution

- name: backend:glsl
  color: c5def5
  description: OpenGL GLSL
  renamed-from: [opengl backend]
  paths:
    - crosstl*[/_-]glsl[/_.-]*
    - tests*[/_-]glsl[/_.-]*
    - crosstl*[/_-]opengl[/_.-]*
    - tests*[/_-]opengl[/_.-]*
- name: backend:hlsl
  color: c5def5
  description: DirectX HLSL
  renamed-from: [Directx backend]
  paths:
    - crosstl*[/_-]hlsl[/_.-]*
    - tests*[/_-]hlsl[/_.-]*
    - crosstl*[/_-]directx[/_.-]*
    - tests*[/_-]directx[/_.-]*
- name: backend:metal
  color: c5def5
  description: Metal Shading Language
  renamed-from: [Metal backend]
  paths:
    - crosstl*[/_-]metal[/_.-]*
    - tests*[/_-]metal[/_.-]*
    - crosstl*[/_-]msl[/_.-]*
    - tests*[/_-]msl[/_.-]*
- name: backend:spirv
  color: c5def5
  description: Vulkan SPIR-V
  renamed-from: [vulkan backend]
  paths:
    - crosstl*[/_-]spirv[/_.-]*
    - tests*[/_-]spirv[/_.-]*
    - crosstl*[/_-]vulkan[/_.-]*
    - tests*[/_-]vulkan[/_.-]*
- name: backend:wgsl
  color: c5def5
  description: WebGPU WGSL
  paths:
    - crosstl*[/_-]wgsl[/_.-]*
    - tests*[/_-]wgsl[/_.-]*
- name: backend:webgl
  color: c5def5
  description: GLSL ES 3.00 for WebGL 2
  paths:
    - crosstl*[/_-]webgl[/_.-]*
    - tests*[/_-]webgl[/_.-]*
- name: backend:cuda
  color: c5def5
  description: CUDA
  paths:
    - crosstl*[/_-]cuda[/_.-]*
    - tests*[/_-]cuda[/_.-]*
- name: backend:hip
  color: c5def5
  description: HIP
  paths:
    - crosstl*[/_-]hip[/_.-]*
    - tests*[/_-]hip[/_.-]*
- name: backend:slang
  color: c5def5
  description: Slang
  paths:
    - crosstl*[/_-]slang[/_.-]*
    - tests*[/_-]slang[/_.-]*
- name: backend:rust
  color: c5def5
  description: Rust GPU
  paths:
    - crosstl*[/_-]rust[/_.-]*
    - tests*[/_-]rust[/_.-]*
- name: backend:mojo
  color: c5def5
  description: Mojo
  paths:
    - crosstl*[/_-]mojo[/_.-]*
    - tests*[/_-]mojo[/_.-]*
- name: backend:opencl
  color: c5def5
  description: OpenCL C
  paths:
    - crosstl*[/_-]opencl[/_.-]*
    - tests*[/_-]opencl[/_.-]*
- name: backend:crossgl
  color: 5319e7
  description: The CrossGL IR itself
  paths:
    - crosstl/translator/ast.py
    - crosstl/translator/lexer.py
    - crosstl/translator/parser.py
    - crosstl/translator/language_spec.py

- name: direction:input
  color: fef2c0
  description: Importing a native language into CrossGL
  paths:
    - crosstl/backend/*
- name: direction:output
  color: fef2c0
  description: Generating a native language from CrossGL
  paths:
    - crosstl/translator/codegen/*

- name: area:frontend
  color: 1d76db
  description: Parsers, importers and the CrossGL IR
  renamed-from: [Translator Frontend]
  paths:
    - crosstl/backend/*
    - crosstl/translator/ast.py
    - crosstl/translator/lexer.py
    - crosstl/translator/parser.py
    - crosstl/translator/language_spec.py
    - crosstl/translator/preprocessor/*
    - crosstl/translator/semantics/*
- name: area:codegen
  color: 1d76db
  description: Code generators
  paths:
    - crosstl/translator/codegen/*
- name: area:runtime
  color: 1d76db
  description: Native loaders, runtimes and execution checks
  paths:
    - crosstl/project/*runtime*
    - crosstl/project/native_*
    - crosstl/project/*worker*
- name: area:ci
  color: 1d76db
  description: Workflows, tests and coverage tooling
  paths:
    - ".github/workflows/*"
    - ".github/actions/*"
    - ".github/actionlint.yaml"
    - ".pre-commit-config.yaml"
    - tools/coverage/*
    - tests/coverage/*
- name: area:docs
  color: 1d76db
  description: Documentation site and guides
  paths:
    - docs/*
    - readme.md
    - contributing.md

- name: coverage
  color: 0e8a16
  description: Managed by the coverage workflow; edits are overwritten
- name: stale
  color: 808080
  description: No activity for a long time
- name: Amazon Q development agent
  color: ff9900
  description: Amazon Q Developer implements this issue and opens a pull request
- name: dependencies
  color: 0366d6
  description: Dependency updates
- name: ci:full
  color: b60205
  description: Run the full CI tier on this pull request
