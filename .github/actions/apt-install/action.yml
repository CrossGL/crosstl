name: Install apt packages
description: >-
  Run apt-get update and install on a Linux runner with bounded network steps. A stalled mirror can hold apt-get
  without output until the job times out, so the update and the download each get a time limit and up to three
  attempts. Packages are installed only after all of them have downloaded, so a retry never interrupts dpkg.

inputs:
  packages:
    description: Space-separated package names, optionally pinned as name=version.
    required: true
  recommends:
    description: Set to "false" to pass --no-install-recommends.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install ${{ inputs.packages }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        RECOMMENDS: ${{ inputs.recommends }}
      run: |
        set -euo pipefail
        read -ra packages <<<"$PACKAGES"
        apt=(sudo apt-get -q -y -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        if [ "$RECOMMENDS" = false ]; then
          apt+=(--no-install-recommends)
        fi
        for attempt in 1 2 3; do
          if timeout 180 "${apt[@]}" update && timeout 420 "${apt[@]}" install --download-only "${packages[@]}"; then
            "${apt[@]}" install "${packages[@]}"
            exit 0
          fi
          echo "::warning::apt-get attempt $attempt failed or timed out"
          sleep 20
        done
        echo "::error::apt-get could not download ${PACKAGES} in 3 attempts"
        exit 1
