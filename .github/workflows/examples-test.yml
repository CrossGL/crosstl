name: CrossGL-Translator Examples Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-versions:
    name: Select Python versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.select.outputs.versions }}
    steps:
      - name: Select Python versions
        id: select
        env:
          # Pushes to main and pull requests labelled ci:full test every supported
          # version; other pull requests test the oldest and the newest.
          FULL_PYTHON_VERSIONS: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
          PULL_REQUEST_PYTHON_VERSIONS: '["3.11", "3.15"]'
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "versions=$FULL_PYTHON_VERSIONS" >> "$GITHUB_OUTPUT"
          else
            echo "versions=$PULL_REQUEST_PYTHON_VERSIONS" >> "$GITHUB_OUTPUT"
          fi

  test-examples:
    name: Examples - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: python-versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
        os: [ubuntu-latest]
        include:
          - python-version: "3.13"
            os: windows-latest
          - python-version: "3.13"
            os: macOS-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
        shell: bash

      # examples/test.py translates every example to every backend its category
      # supports and fails on any outcome its EXPECTED_REJECTIONS table does not list.
      - name: Translate the examples
        run: python examples/test.py
        shell: bash

  result:
    # The one check per workflow that branch protection and the merge queue require.
    name: Examples Test result
    if: always()
    needs: [python-versions, test-examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
