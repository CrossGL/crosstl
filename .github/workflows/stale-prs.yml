name: Close Stale Pull Requests

# Marks pull requests stale after 14 days without activity and closes them 7 days later. Issues are excluded
# because they are triaged by hand; an inactive issue is not necessarily resolved.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  close_stale_prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close stale pull requests
        uses: actions/stale@v11
        with:
          days-before-stale: 14
          days-before-close: 7
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-message: 'This pull request has been marked as stale because it has been inactive for more than 14 days. Please update this pull request or it will be automatically closed in 7 days.'
          stale-pr-label: stale
          close-pr-message: 'This pull request has been automatically closed because it has been inactive for more than 21 days. Please reopen if you still intend to submit this pull request.'
