            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-host/build.log
      - name: Translate unchanged upstream kernels
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 2400 --label "MLX host package translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --output-dir .mlx-portable-host/packages 2>&1 | tee .mlx-portable-host/translation.log
      - name: Execute upstream tests on the translated backend
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 4000 --label "MLX portable host verification" -- \
            python -m demos.integrations.mlx.portable_host.verify --mlx-root mlx-upstream \
              --packages .mlx-portable-host/packages --output-dir .mlx-portable-host/evidence 2>&1 | tee .mlx-portable-host/verification.log
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-host-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-host
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  small-row-reductions:
    name: MLX small-row reductions (${{ matrix.target }})
    needs: portable-host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
          - os: windows-2025
            target: directx
          - os: macos-26
            target: metal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize small-row evidence
        run: mkdir -p .mlx-portable-small-rows
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-small-rows/dependencies.log
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: python -m pip install moderngl PyOpenGL
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-small-rows/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-small-rows/swift-version.txt
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Select same-run host packages
        uses: actions/github-script@v7
        id: host-artifact
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const prefix = `mlx-portable-host-${process.env.MLX_TARGET}-`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const candidates = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
              && /^\d+$/.test(item.name.slice(prefix.length)));
            candidates.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
            if (!candidates.length) throw new Error("The required host proof artifact is missing.");
            core.setOutput("id", candidates[0].id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.host-artifact.outputs.id }}
          path: .mlx-portable-small-rows/base
          merge-multiple: true
      - name: Prepare pinned MLX
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-small-rows/adaptation.json
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX small-row host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-small-rows/build.log
      - name: Execute small-row host reductions
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 4000 --label "MLX small-row host verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_small_rows --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --output-dir .mlx-portable-small-rows/evidence 2>&1 | tee .mlx-portable-small-rows/verification.log
      - name: Translate reduction initialization
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX initialization translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family init --jobs 4 --output-dir .mlx-portable-small-rows/init-packages \
              2>&1 | tee .mlx-portable-small-rows/init-translation.log
      - name: Execute empty host reductions
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "MLX empty reduction verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_empty_reductions --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --reductions .mlx-portable-small-rows/init-packages \
              --output-dir .mlx-portable-small-rows/empty-evidence 2>&1 | tee .mlx-portable-small-rows/empty-verification.log
      - name: Translate bitwise host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX bitwise translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family bitwise --output-dir .mlx-portable-small-rows/bitwise-packages \
              2>&1 | tee .mlx-portable-small-rows/bitwise-translation.log
      - name: Execute bitwise host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1500 --label "MLX bitwise verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_bitwise --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --bitwise .mlx-portable-small-rows/bitwise-packages \
              --output-dir .mlx-portable-small-rows/bitwise-evidence 2>&1 | tee .mlx-portable-small-rows/bitwise-verification.log
      - name: Translate concatenation test reduction
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX concatenation reduction translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --entry all_reduce_andbool_ --width 32 \
              --output-dir .mlx-portable-small-rows/concatenate-reductions \
              2>&1 | tee .mlx-portable-small-rows/concatenate-translation.log
      - name: Execute concatenation host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1500 --label "MLX concatenation verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_concatenate --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --reductions .mlx-portable-small-rows/concatenate-reductions \
              --output-dir .mlx-portable-small-rows/concatenate-evidence 2>&1 | tee .mlx-portable-small-rows/concatenate-verification.log
      - name: Translate selection host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX selection translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family selection --output-dir .mlx-portable-small-rows/selection-packages \
              2>&1 | tee .mlx-portable-small-rows/selection-translation.log
      - name: Translate absolute-value host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX absolute-value translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family absolute --output-dir .mlx-portable-small-rows/absolute-packages \
              2>&1 | tee .mlx-portable-small-rows/absolute-translation.log
      - name: Execute selection host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX selection verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_selection --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --selection .mlx-portable-small-rows/selection-packages \
              --absolute .mlx-portable-small-rows/absolute-packages --reductions .mlx-portable-small-rows/concatenate-reductions \
              --output-dir .mlx-portable-small-rows/selection-evidence 2>&1 | tee .mlx-portable-small-rows/selection-verification.log
      - name: Retain small-row execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-small-rows-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-small-rows
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  row-packages:
    name: MLX row translation (${{ matrix.target }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: [metal, opengl, directx]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize row translation evidence
        run: mkdir -p .mlx-row-shard
      - name: Install translation dependencies
        run: |
          set -euo pipefail
          python -m pip install -e . 2>&1 | tee .mlx-row-shard/dependencies.log
      - name: Check out pinned MLX kernels
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
      - name: Translate complete row shard
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 7200 --label "MLX row translation shard" -- \
            python -m demos.integrations.mlx.portable_host.reduction_shards build --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --shard "${{ matrix.shard }}" --jobs 2 \
              --output-dir .mlx-row-shard/packages 2>&1 | tee .mlx-row-shard/translation.log
      - name: Retain row translation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-row-packages-${{ matrix.target }}-s${{ matrix.shard }}-${{ github.run_attempt }}
          path: .mlx-row-shard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  reductions:
    name: MLX ${{ matrix.family }} reductions (${{ matrix.target }})
    needs: [portable-host, row-packages]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
            family: all
            verifier: verify
          - os: windows-2025
            target: directx
            family: all
            verifier: verify
          - os: macos-26
            target: metal
            family: all
            verifier: verify
          - os: ubuntu-24.04
            target: opengl
            family: row
            verifier: verify_rows
            verification_timeout: 7800
            companion_args: --all-reductions .mlx-portable-reductions/companions --require-all-widths
          - os: windows-2025
            target: directx
            family: row
            verifier: verify_rows
            verification_timeout: 7800
            companion_args: --all-reductions .mlx-portable-reductions/companions --require-all-widths
          - os: macos-26
            target: metal
            family: row
            verifier: verify_rows
            verification_timeout: 7800
            companion_args: --all-reductions .mlx-portable-reductions/companions --require-all-widths
          - os: windows-2025
            target: directx
            family: column
            verifier: verify_columns
          - os: ubuntu-24.04
            target: opengl
            family: column
            verifier: verify_columns
          - os: macos-26
            target: metal
            family: column
            verifier: verify_columns
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize reduction evidence
        run: mkdir -p .mlx-portable-reductions
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-reductions/dependencies.log
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: python -m pip install moderngl PyOpenGL
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-reductions/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-reductions/swift-version.txt
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Select same-run host packages
        uses: actions/github-script@v7
        id: host-artifact
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const prefix = `mlx-portable-host-${process.env.MLX_TARGET}-`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const candidates = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
              && /^\d+$/.test(item.name.slice(prefix.length)));
            candidates.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
            if (!candidates.length) throw new Error("The required host proof artifact is missing.");
            core.setOutput("id", candidates[0].id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.host-artifact.outputs.id }}
          path: .mlx-portable-reductions/base
          merge-multiple: true
      - name: Prepare pinned MLX
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-reductions/adaptation.json
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX reduction host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-reductions/build.log
      - name: Translate reduction launch variants
        if: matrix.family != 'row'
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 12000 --label "MLX reduction packages" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --family ${{ matrix.family }} --jobs 2 --output-dir .mlx-portable-reductions/packages 2>&1 | tee .mlx-portable-reductions/translation.log
      - name: Select same-run row shards
        if: matrix.family == 'row'
        uses: actions/github-script@v7
        id: row-artifacts
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const ids = [];
            for (let shard = 0; shard < 8; shard++) {
              const prefix = `mlx-row-packages-${process.env.MLX_TARGET}-s${shard}-`;
              const matches = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
                && /^\d+$/.test(item.name.slice(prefix.length)));
              matches.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
              if (!matches.length) throw new Error(`Missing row translation shard ${shard}`);
              ids.push(matches[0].id);
            }
            core.setOutput("ids", ids.join(","));
      - name: Download row shards
        if: matrix.family == 'row'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.row-artifacts.outputs.ids }}
          path: .mlx-portable-reductions/packages/shards
          merge-multiple: false
      - name: Verify complete row package collection
        if: matrix.family == 'row'
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 300 --label "MLX row package collection" -- \
            python -m demos.integrations.mlx.portable_host.reduction_shards collect \
              --directory .mlx-portable-reductions/packages --target "${{ matrix.target }}" \
              2>&1 | tee .mlx-portable-reductions/collection.log
      - name: Compile every row variant natively
        if: matrix.family == 'row'
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 7200 --label "MLX row native compilation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_shards compile \
              --directory .mlx-portable-reductions/packages --target "${{ matrix.target }}" \
              --output-dir .mlx-portable-reductions/compiled \
              2>&1 | tee .mlx-portable-reductions/compilation.log
      - name: Translate whole-array companions for mixed workloads
        if: matrix.family == 'row'
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "MLX mixed reduction packages" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --family all --width 32 --jobs 2 \
              --output-dir .mlx-portable-reductions/companions 2>&1 | tee .mlx-portable-reductions/companion-translation.log
      - name: Execute MLX reductions
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds ${{ matrix.verification_timeout || 5400 }} --label "MLX reduction host verification" -- \
            python -m demos.integrations.mlx.portable_host.${{ matrix.verifier }} --mlx-root mlx-upstream \
              --packages .mlx-portable-reductions/base/packages --reductions .mlx-portable-reductions/packages \
              ${{ matrix.companion_args }} --output-dir .mlx-portable-reductions/evidence 2>&1 | tee .mlx-portable-reductions/verification.log
      - name: Retain reduction execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-${{ matrix.family }}-reductions-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-reductions
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
