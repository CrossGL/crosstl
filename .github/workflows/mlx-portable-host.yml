      - "tests/test_translator/test_buffer_requirements.py"
      - "tools/run_bounded_command.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
  PYTHONUNBUFFERED: "1"
  PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

concurrency:
  group: mlx-portable-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-host:
    name: MLX native host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 185
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
          - os: windows-2025
            target: directx
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize execution evidence
        run: |
          mkdir -p .mlx-portable-host
          python --version > .mlx-portable-host/python-version.txt
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-host/dependencies.log
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m pip install moderngl PyOpenGL 2>&1 | tee -a .mlx-portable-host/dependencies.log
          python -c "import moderngl, OpenGL; print(moderngl.__version__, OpenGL.__version__)"
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Validate portable host contracts
        run: python -m pytest -q -n auto tests/test_mlx_portable_host.py
      - name: Validate Metal argument inference
        env:
          CROSTL_REQUIRE_METAL_ARGUMENT_INFERENCE: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/argument-inference
          python tools/run_bounded_command.py --timeout-seconds 120 --label "Native argument inference" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/argument-inference/pytest \
              --junitxml=.mlx-portable-host/argument-inference/results.xml \
              tests/test_translator/test_project_metal_discovery.py \
              2>&1 | tee .mlx-portable-host/argument-inference.log
      - name: Validate native scalar math
        env:
          CROSTL_REQUIRE_DIRECTX_ATAN2: ${{ runner.os == 'Windows' && '1' || '0' }}
          CROSTL_REQUIRE_METAL_PRECISE_ASIN: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/scalar-math
          python tools/run_bounded_command.py --timeout-seconds 120 --label "Native scalar math" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/scalar-math/pytest \
              --junitxml=.mlx-portable-host/scalar-math/results.xml \
              tests/test_translator/test_directx_atan2.py \
              tests/test_translator/test_metal_precise_asin.py \
              2>&1 | tee .mlx-portable-host/scalar-math.log
      - name: Validate OpenGL half conversions
        if: runner.os == 'Linux'
        env:
          CROSTL_REQUIRE_HALF_CONVERSION_RUNTIME: "1"
          CROSTL_HALF_CONVERSION_TARGET: opengl
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/half-conversions
          python tools/run_bounded_command.py --timeout-seconds 180 --label "OpenGL half conversions" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/half-conversions/pytest \
              --junitxml=.mlx-portable-host/half-conversions/results.xml \
              tests/test_translator/test_opengl_half_conversion.py \
              2>&1 | tee .mlx-portable-host/half-conversions.log
      - name: Validate OpenGL uniform blocks
        if: runner.os == 'Linux'
        env:
          CROSTL_REQUIRE_UNIFORM_BLOCK_RUNTIME: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/uniform-blocks
          python tools/run_bounded_command.py --timeout-seconds 180 --label "OpenGL uniform blocks" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/uniform-blocks/pytest \
              --junitxml=.mlx-portable-host/uniform-blocks/results.xml \
              tests/test_translator/test_uniform_block_layouts.py \
              2>&1 | tee .mlx-portable-host/uniform-blocks.log
      - name: Validate DirectX half conversions
        if: runner.os == 'Windows'
        env:
          CROSTL_REQUIRE_HALF_CONVERSION_RUNTIME: "1"
          CROSTL_HALF_CONVERSION_TARGET: directx
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/half-conversions
          python tools/run_bounded_command.py --timeout-seconds 180 --label "DirectX half conversions" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/half-conversions/pytest \
              --junitxml=.mlx-portable-host/half-conversions/results.xml \
              tests/test_translator/test_directx_half_conversion.py \
              2>&1 | tee .mlx-portable-host/half-conversions.log
      - name: Validate DirectX float atomics
        if: runner.os == 'Windows'
        env:
          CROSTL_REQUIRE_DIRECTX_FLOAT_ATOMICS: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/float-atomics
          python tools/run_bounded_command.py --timeout-seconds 180 --label "DirectX float atomics" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/float-atomics/pytest \
              --junitxml=.mlx-portable-host/float-atomics/results.xml \
              tests/test_translator/test_directx_float_atomics.py \
              2>&1 | tee .mlx-portable-host/float-atomics.log
      - name: Validate DirectX software reductions
        if: runner.os == 'Windows'
        env:
          CROSTL_REQUIRE_DIRECTX_SOFTWARE_REDUCTIONS: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/software-reductions
          python tools/run_bounded_command.py --timeout-seconds 180 --label "DirectX software reductions" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/software-reductions/pytest \
              --junitxml=.mlx-portable-host/software-reductions/results.xml \
              tests/test_translator/test_directx_software_reductions.py \
              tests/test_translator/test_directx_subgroup_identity.py \
              tests/test_translator/test_directx_subgroup_uniformity.py \
              tests/test_translator/test_directx_subgroup_components.py \
              2>&1 | tee .mlx-portable-host/software-reductions.log
      - name: Validate binary32 fused arithmetic
        env:
          CROSTL_REQUIRE_FUSED_MATH: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/fused-math
          python tools/run_bounded_command.py --timeout-seconds 120 --label "Native fused arithmetic" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/fused-math/pytest \
              --junitxml=.mlx-portable-host/fused-math/results.xml \
              tests/test_translator/test_fused_math.py \
              tests/test_translator/test_metal_fma.py \
              2>&1 | tee .mlx-portable-host/fused-math.log
      - name: Checkout and prepare pinned upstream MLX
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          mkdir -p .mlx-portable-host
          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-host/adaptation.json
      - name: Compile pinned DirectX gated-delta backward entry
        if: runner.os == 'Windows'
        env:
          CROSTL_REQUIRE_MLX_GATED_DELTA_DIRECTX: "1"
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/gated-delta
          python tools/run_bounded_command.py --timeout-seconds 300 --label "MLX DirectX gated-delta compilation" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/gated-delta/pytest \
              --junitxml=.mlx-portable-host/gated-delta/results.xml \
              tests/test_translator/test_mlx_gated_delta_directx.py \
              2>&1 | tee .mlx-portable-host/gated-delta.log
      - name: Execute pinned DirectX gated-delta gradients
        if: runner.os == 'Windows'
        env:
          CROSTL_REQUIRE_MLX_GATED_DELTA_DIRECTX_RUNTIME: "1"
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/gated-delta-runtime
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX DirectX gated-delta execution" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-portable-host/gated-delta-runtime/pytest \
              --junitxml=.mlx-portable-host/gated-delta-runtime/results.xml \
              tests/test_translator/test_mlx_gated_delta_directx_runtime.py \
              2>&1 | tee .mlx-portable-host/gated-delta-runtime.log
      - name: Execute pinned portable attention row dots
        env:
          CROSTL_REQUIRE_MLX_ATTENTION_RUNTIME: "1"
          CROSTL_MLX_ATTENTION_TARGET: ${{ matrix.target }}
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/attention-odo
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX portable attention row dots" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-portable-host/attention-odo/pytest \
              --junitxml=.mlx-portable-host/attention-odo/results.xml \
              tests/test_translator/test_mlx_attention_odo_runtime.py \
              2>&1 | tee .mlx-portable-host/attention-odo.log
      - name: Execute pinned OpenGL attention derivatives
        if: runner.os == 'Linux'
        env:
          CROSTL_REQUIRE_MLX_ATTENTION_DS_OPENGL: "1"
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/attention-ds
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX OpenGL attention derivatives" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-portable-host/attention-ds/pytest \
              --junitxml=.mlx-portable-host/attention-ds/results.xml \
              tests/test_translator/test_mlx_attention_ds_opengl.py \
              2>&1 | tee .mlx-portable-host/attention-ds.log
      - name: Execute pinned DirectX attention derivatives
        if: runner.os == 'Windows'
        env:
          CROSTL_REQUIRE_MLX_ATTENTION_DS_RUNTIME: "1"
          CROSTL_MLX_ATTENTION_DS_TARGET: directx
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/attention-ds
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX DirectX attention derivatives" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-portable-host/attention-ds/pytest \
              --junitxml=.mlx-portable-host/attention-ds/results.xml \
              tests/test_translator/test_mlx_attention_ds_runtime.py \
              2>&1 | tee .mlx-portable-host/attention-ds.log
      - name: Validate pinned unary fused arithmetic
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_MLX_CURRENT_TARGET: ${{ matrix.target }}
          CROSTL_REQUIRE_MLX_CURRENT_UNARY_FMA: "1"
          CROSTL_REQUIRE_MLX_CURRENT_UNARY_TRIG: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/unary-fma
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Pinned unary fused arithmetic" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/unary-fma/pytest \
              --junitxml=.mlx-portable-host/unary-fma/results.xml \
              tests/test_translator/test_mlx_current_unary_fma.py \
              tests/test_translator/test_mlx_current_unary_trig.py \
              2>&1 | tee .mlx-portable-host/unary-fma.log
      - name: Validate pinned native binary math
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_MLX_CURRENT_TARGET: ${{ matrix.target }}
          CROSTL_REQUIRE_MLX_CURRENT_COMPLEX_POWER: "1"
          CROSTL_REQUIRE_MLX_CURRENT_BINARY_SHAPES: "1"
          CROSTL_REQUIRE_STRUCT_BUFFER_RUNTIME: "1"
          CROSTL_RUN_NATIVE_LOADER_DIRECTX_DEVICE_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}
          CROSTL_RUN_NATIVE_LOADER_OPENGL_DEVICE_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/binary-math
          python tools/run_bounded_command.py --timeout-seconds 900 --label "Pinned native binary math" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/binary-math/pytest \
              --junitxml=.mlx-portable-host/binary-math/results.xml \
              tests/test_translator/test_struct_buffer_layouts.py \
              tests/test_translator/test_buffer_requirements.py \
              tests/test_translator/test_native_dispatch_limits.py \
              tests/test_translator/test_native_loader_dispatch_integration.py \
              tests/test_translator/test_mlx_current_complex_power.py \
              tests/test_translator/test_mlx_current_binary_shapes.py \
              2>&1 | tee .mlx-portable-host/binary-math.log
      - name: Execute pinned resident attention reductions
        env:
          CROSTL_REQUIRE_MLX_ATTENTION_REDUCE_RUNTIME: "1"
          CROSTL_MLX_ATTENTION_REDUCE_TARGET: ${{ matrix.target }}
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/attention-reduce
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Resident attention reductions" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-portable-host/attention-reduce/pytest \
              --junitxml=.mlx-portable-host/attention-reduce/results.xml \
              tests/test_translator/test_mlx_attention_reduce_runtime.py \
              2>&1 | tee .mlx-portable-host/attention-reduce.log
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX portable host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-host/build.log
      - name: Translate unchanged upstream kernels
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX host package translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --output-dir .mlx-portable-host/packages 2>&1 | tee .mlx-portable-host/translation.log
      - name: Execute upstream tests on the translated backend
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1600 --label "MLX portable host verification" -- \
            python -m demos.integrations.mlx.portable_host.verify --mlx-root mlx-upstream \
              --packages .mlx-portable-host/packages --output-dir .mlx-portable-host/evidence 2>&1 | tee .mlx-portable-host/verification.log
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-host-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-host
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
