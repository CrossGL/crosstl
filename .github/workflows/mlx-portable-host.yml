              tests/test_translator/test_metal_boolean_promotion.py \
              tests/test_translator/test_metal_float_selection.py \
              tests/test_translator/test_boolean_buffer_runtime.py \
              tests/test_translator/test_mlx_current_unary_sign.py \
              2>&1 | tee .mlx-portable-host/boolean-promotion.log
      - name: Validate pinned copy layouts
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_MLX_CURRENT_TARGET: ${{ matrix.target }}
          CROSTL_REQUIRE_MLX_CURRENT_COPY: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
