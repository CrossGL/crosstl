permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
  PYTHONUNBUFFERED: "1"
  PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

concurrency:
  group: mlx-portable-host-${{ github.ref }}
  # Preserve native runs; newer commits replace only the pending run.
  cancel-in-progress: false

jobs:
  portable-host:
    name: MLX native host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
          - os: windows-2025
            target: directx
          - os: macos-26
            target: metal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize execution evidence
        run: |
          mkdir -p .mlx-portable-host
          python --version > .mlx-portable-host/python-version.txt
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist "PyYAML>=6,<7" setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-host/dependencies.log
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-host/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-host/swift-version.txt
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m pip install moderngl PyOpenGL 2>&1 | tee -a .mlx-portable-host/dependencies.log
          python -c "import moderngl, OpenGL; print(moderngl.__version__, OpenGL.__version__)"
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Validate portable host contracts
        run: python -m pytest -q -n auto tests/test_mlx_portable_host.py tests/test_mlx_portable_reductions.py tests/test_mlx_portable_rows.py tests/test_mlx_portable_reduction_shards.py tests/test_mlx_portable_mixed_reductions.py tests/test_mlx_portable_columns.py tests/test_mlx_portable_small_rows.py tests/test_mlx_portable_empty_reductions.py tests/test_mlx_portable_bitwise.py tests/test_mlx_portable_concatenate.py tests/test_mlx_portable_selection.py tests/test_mlx_random_audit.py
      - name: Validate software subgroup votes
        env:
          CROSTL_REQUIRE_SOFTWARE_SUBGROUP_VOTES: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/subgroup-votes
          python tools/run_bounded_command.py --timeout-seconds 180 --label "Software subgroup votes" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/subgroup-votes/pytest \
              --junitxml=.mlx-portable-host/subgroup-votes/results.xml \
              tests/test_translator/test_software_subgroup_votes.py \
              tests/test_translator/test_opengl_subgroup_wrappers.py \
              2>&1 | tee .mlx-portable-host/subgroup-votes.log
      - name: Validate software subgroup products
        env:
          CROSTL_REQUIRE_SOFTWARE_SUBGROUP_PRODUCT: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/subgroup-products
          python tools/run_bounded_command.py --timeout-seconds 180 --label "Software subgroup products" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/subgroup-products/pytest \
              --junitxml=.mlx-portable-host/subgroup-products/results.xml \
              tests/test_translator/test_software_subgroup_product.py \
              2>&1 | tee .mlx-portable-host/subgroup-products.log
      - name: Validate subgroup-guarded returns
        env:
          CROSTL_REQUIRE_SUBGROUP_GUARDED_RETURNS: "1"
          CROSTL_REQUIRE_FLOAT_SELF_COMPARISONS: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/subgroup-returns
          python tools/run_bounded_command.py --timeout-seconds 180 --label "Subgroup-guarded returns" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/subgroup-returns/pytest \
              --junitxml=.mlx-portable-host/subgroup-returns/results.xml \
              tests/test_translator/test_subgroup_guarded_returns.py \
              tests/test_translator/test_directx_self_comparisons.py \
              tests/test_translator/test_opengl_vector_comparisons.py \
              tests/test_translator/test_opengl_subgroup_exit_uniformity.py \
              2>&1 | tee .mlx-portable-host/subgroup-returns.log
      - name: Validate collective helper arguments
        env:
          CROSTL_REQUIRE_SUBGROUP_UNIFORM_ARGUMENTS: "1"
          CROSTL_REQUIRE_WORKGROUP_RANGE_READBACKS: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/subgroup-arguments
          python tools/run_bounded_command.py --timeout-seconds 360 --label "Collective helper arguments" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/subgroup-arguments/pytest \
              --junitxml=.mlx-portable-host/subgroup-arguments/results.xml \
              tests/test_translator/test_subgroup_uniform_arguments.py \
              tests/test_translator/test_software_subgroup_workgroup_ranges.py \
              2>&1 | tee .mlx-portable-host/subgroup-arguments.log
      - name: Validate exact partial subgroup execution
        env:
          CROSTL_REQUIRE_PARTIAL_SUBGROUP_READBACKS: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/subgroup-partial
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Exact partial subgroup execution" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/subgroup-partial/pytest \
              --junitxml=.mlx-portable-host/subgroup-partial/results.xml \
              tests/test_translator/test_software_subgroup_partial.py \
              2>&1 | tee .mlx-portable-host/subgroup-partial.log
      - name: Validate source wave argument conversions
        env:
          CROSTL_REQUIRE_WAVE_ARGUMENT_READBACKS: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/wave-arguments
          python tools/run_bounded_command.py --timeout-seconds 600 --label "Source wave argument conversions" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/wave-arguments/pytest \
              --junitxml=.mlx-portable-host/wave-arguments/results.xml \
              tests/test_translator/test_metal_wave_arguments.py \
              2>&1 | tee .mlx-portable-host/wave-arguments.log
      - name: Validate exact dispatch regions
        env:
          CROSTL_REQUIRE_DISPATCH_REGIONS: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/dispatch-regions
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Exact dispatch region execution" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/dispatch-regions/pytest \
              --junitxml=.mlx-portable-host/dispatch-regions/results.xml \
              tests/test_translator/test_dispatch_regions.py \
              tests/test_translator/test_dispatch_region_project.py \
              2>&1 | tee .mlx-portable-host/dispatch-regions.log
      - name: Validate Metal argument inference
        env:
          CROSTL_REQUIRE_METAL_ARGUMENT_INFERENCE: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/argument-inference
          python tools/run_bounded_command.py --timeout-seconds 120 --label "Native argument inference" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/argument-inference/pytest \
              --junitxml=.mlx-portable-host/argument-inference/results.xml \
              tests/test_translator/test_project_metal_discovery.py \
              2>&1 | tee .mlx-portable-host/argument-inference.log
      - name: Validate native scalar math
        env:
          CROSTL_REQUIRE_DIRECTX_ATAN2: ${{ runner.os == 'Windows' && '1' || '0' }}
          CROSTL_REQUIRE_METAL_PRECISE_ASIN: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/scalar-math
          python tools/run_bounded_command.py --timeout-seconds 120 --label "Native scalar math" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-portable-host/scalar-math/pytest \
              --junitxml=.mlx-portable-host/scalar-math/results.xml \
              tests/test_translator/test_directx_atan2.py \
