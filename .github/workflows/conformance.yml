name: Conformance

# Translation conformance and differential execution (tests/conformance). Every cell of the hazard suite is
# translated, checked by the target's native validator and executed on the runtimes provisioned here, then
# compared with the committed scoreboard for this CI profile; a cell that regresses, goes missing or loses its
# runtime fails the job. Pull requests run the fixture cases; the nightly tier adds the seeded held-out kernels.
# A pull request labelled "conformance-full" runs the nightly tier too.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "0"

on:
  push:
    branches:
      - main
    paths:
      - "crosstl/**"
      - "tests/conformance/**"
      - ".github/workflows/conformance.yml"
      - ".github/actions/install-linux-dxc/**"
      - ".github/actions/install-shader-validators/**"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "crosstl/**"
      - "tests/conformance/**"
      - ".github/workflows/conformance.yml"
      - ".github/actions/install-linux-dxc/**"
      - ".github/actions/install-shader-validators/**"
      - "pyproject.toml"
      - "requirements.txt"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      heldout:
        description: Held-out kernels generated per family and language (0 runs the fixtures only)
        default: "6"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Conformance harness unit tests
    if: github.event.action != 'labeled' || github.event.label.name == 'conformance-full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CrossTL and harness dependencies
        run: python -m pip install -e . numpy==2.5.4 pytest==9.1.1
      - name: Harness and inventory unit tests
        run: python -m pytest -q --no-header -p no:warnings --tb=short -rfE tests/conformance
      - name: Inventories match their pinned specifications
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tests.conformance.inventory.spirv --fetch --check
          python -m tests.conformance.inventory.glsl --fetch --check
          python -m tests.conformance.inventory.hlsl --fetch --check
          python -m tests.conformance.inventory >> "$GITHUB_STEP_SUMMARY"

  native:
    name: Conformance (${{ matrix.name }})
    if: github.event.action != 'labeled' || github.event.label.name == 'conformance-full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Mesa lavapipe and llvmpipe
            os: ubuntu-24.04
            targets: glsl,spirv,hlsl
            runtimes: vulkan-lavapipe,opengl-llvmpipe
            extra: ""
          - name: macOS Metal
            os: xcode-27
            targets: metal
            runtimes: metal-apple
            extra: pyobjc-framework-Metal==12.2.2
            developer_dir: /Applications/Xcode_27.1.app/Contents/Developer
          - name: Windows Direct3D 12 WARP
            os: windows-2022
            targets: hlsl
            runtimes: d3d12-warp
            extra: compushady==0.17.5
    env:
      CROSSTL_CONFORMANCE_MESA: container
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      CROSSTL_CONFORMANCE_CACHE: ${{ github.workspace }}/../conformance-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Select tier and scoreboard profile
        env:
          HELDOUT_INPUT: ${{ github.event.inputs.heldout }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'conformance-full') }}
        run: |
          set -euo pipefail
          heldout=0
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$FULL_LABEL" = true ]; then
            heldout=6
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            heldout="$HELDOUT_INPUT"
          fi
          case "$heldout" in ''|*[!0-9]*) echo "heldout must be a non-negative integer" >&2; exit 1;; esac
          profile="$(python -c "import platform; print(f'ci-{platform.system()}-{platform.machine()}'.lower())")"
          out="$RUNNER_TEMP/conformance"
          mkdir -p "$out"
          {
            echo "CROSSTL_CONFORMANCE_PROFILE=$profile"
            echo "CONFORMANCE_HELDOUT=$heldout"
            echo "CONFORMANCE_OUT=$out"
            echo "CONFORMANCE_SCOREBOARD=tests/conformance/scoreboards/$profile.json"
          } >> "$GITHUB_ENV"
          echo "Profile $profile, held-out kernels per family: $heldout"

      - name: Install pinned Linux DXC
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-dxc
        with:
          pinned: "true"

      - name: Install pinned glslang and SPIRV-Tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-shader-validators

      - name: Build the pinned Mesa container
        if: runner.os == 'Linux'
        run: docker build -q -t crosstl-conformance-mesa:1 -f tests/conformance/docker/mesa/Dockerfile tests/conformance

      - name: Prepare the Metal toolchain
        if: runner.os == 'macOS'
        run: python tools/ensure_metal_toolchain.py

      - name: Install pinned Windows DXC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc"
          $dxcUri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip"
          $dxcSha256 = "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $dxcUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "DXC download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $dxcSha256) {
            throw "DXC archive checksum mismatch: expected $dxcSha256, got $actualSha256."
          }
          Expand-Archive -Path $archive -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem -Path $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match "\\bin\\x64\\dxc.exe$" } |
            Select-Object -First 1
          if ($null -eq $dxc) {
            throw "dxc.exe not found in release archive."
          }
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install CrossTL and harness dependencies
        env:
          EXTRA: ${{ matrix.extra }}
        run: python -m pip install -e . numpy==2.5.4 pytest==9.1.1 ${EXTRA:+"$EXTRA"}

      # The in-box WARP of the runner image predates current shader models. D3D12 loads d3d10warp.dll from the
      # application directory first, so the pinned redistributable is placed next to python.exe and the
      # adapter then refuses any other WARP build (CROSSTL_CONFORMANCE_WARP_VERSION).
      - name: Install pinned WARP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          $warpUri = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg"
          $warpSha256 = "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $warpUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "WARP download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $warpSha256) {
            throw "WARP package checksum mismatch: expected $warpSha256, got $actualSha256."
          }
          Expand-Archive -Path $archive -DestinationPath $warpRoot -Force
          $pythonDir = python -c "import os, sys; print(os.path.dirname(sys.executable))"
          Copy-Item -Path (Join-Path $warpRoot "build/native/bin/x64/d3d10warp.dll") -Destination $pythonDir -Force
          "CROSSTL_CONFORMANCE_WARP_VERSION=1.0.21.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record toolchains
        run: |
          set -euo pipefail
          python -m tests.conformance.toolchains --markdown | tee "$CONFORMANCE_OUT/toolchains.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Required runtimes reproduce their reference oracle
        env:
          CROSSTL_CONFORMANCE_NATIVE: "1"
          CROSSTL_CONFORMANCE_REQUIRE: ${{ matrix.runtimes }}
        run: python -m pytest -q --no-header -p no:warnings --tb=short -rfEP tests/conformance/test_native_runtimes.py

      # Later steps still run after a reference failure, so the uploaded artifact explains it.
      - name: Translated route against the scoreboard
        id: translated
        if: ${{ !cancelled() }}
        env:
          TARGETS: ${{ matrix.targets }}
          RUNTIMES: ${{ matrix.runtimes }}
        run: >-
          python -m tests.conformance.runner --output "$CONFORMANCE_OUT/translated"
          --targets "$TARGETS" --runtimes "$RUNTIMES" --configs strict,relaxed
          --heldout-per-family "$CONFORMANCE_HELDOUT" --baseline "$CONFORMANCE_SCOREBOARD"

      - name: Reference route against the scoreboard
        if: ${{ !cancelled() }}
        env:
          TARGETS: ${{ matrix.targets }}
          RUNTIMES: ${{ matrix.runtimes }}
        run: >-
          python -m tests.conformance.runner --output "$CONFORMANCE_OUT/reference" --reference
          --targets "$TARGETS" --runtimes "$RUNTIMES"
          --heldout-per-family "$CONFORMANCE_HELDOUT" --baseline "$CONFORMANCE_SCOREBOARD"

      - name: Candidate scoreboard for this profile
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          candidate="$CONFORMANCE_OUT/$CROSSTL_CONFORMANCE_PROFILE.json"
          if [ -f "$CONFORMANCE_SCOREBOARD" ]; then cp "$CONFORMANCE_SCOREBOARD" "$candidate"; fi
          results=()
          for route in translated reference; do
            if [ -f "$CONFORMANCE_OUT/$route/results.jsonl" ]; then results+=("$CONFORMANCE_OUT/$route/results.jsonl"); fi
          done
          if [ "${#results[@]}" -gt 0 ]; then
            python -m tests.conformance.scoreboard "${results[@]}" --write "$candidate"
            echo "Candidate scoreboard: $candidate (artifact conformance-$CROSSTL_CONFORMANCE_PROFILE)"
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-${{ env.CROSSTL_CONFORMANCE_PROFILE }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.CONFORMANCE_OUT }}/*.json
            ${{ env.CONFORMANCE_OUT }}/toolchains.md
            ${{ env.CONFORMANCE_OUT }}/*/run.json
            ${{ env.CONFORMANCE_OUT }}/*/results.jsonl
