name: MLX Metal Host Integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mlx-metal-host.yml"
      - "crosstl/**"
      - "demos/integrations/mlx/**"
      - "tests/test_mlx_metal_host.py"
      - "tests/test_translator/test_project_metal_discovery.py"
      - "tests/test_translator/test_fused_math.py"
      - "tests/test_translator/test_metal_builtin_ownership.py"
      - "tests/test_translator/test_metal_float_atomics.py"
      - "tests/test_translator/test_directx_float_atomics.py"
      - "tests/test_translator/test_mlx_gated_delta_metal.py"
      - "tests/test_translator/test_mlx_gated_delta_runtime.py"
      - "tests/test_translator/test_mlx_attention_odo_runtime.py"
      - "tests/test_translator/test_mlx_attention_ds_runtime.py"
      - "tests/fixtures/runtime_verification/mlx_gated_delta_reference.py"
      - "tests/fixtures/runtime_verification/metal_raw_buffers.swift"
      - "tests/fixtures/runtime_verification/metal_uint32_buffers.swift"
      - "tools/run_bounded_command.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mlx-metal-host.yml"
      - "crosstl/**"
      - "demos/integrations/mlx/**"
      - "tests/test_mlx_metal_host.py"
      - "tests/test_translator/test_project_metal_discovery.py"
      - "tests/test_translator/test_fused_math.py"
      - "tests/test_translator/test_metal_builtin_ownership.py"
      - "tests/test_translator/test_metal_float_atomics.py"
      - "tests/test_translator/test_directx_float_atomics.py"
      - "tests/test_translator/test_mlx_gated_delta_metal.py"
      - "tests/test_translator/test_mlx_gated_delta_runtime.py"
      - "tests/test_translator/test_mlx_attention_odo_runtime.py"
      - "tests/test_translator/test_mlx_attention_ds_runtime.py"
      - "tests/fixtures/runtime_verification/mlx_gated_delta_reference.py"
      - "tests/fixtures/runtime_verification/metal_raw_buffers.swift"
      - "tests/fixtures/runtime_verification/metal_uint32_buffers.swift"
      - "tools/run_bounded_command.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
  PYTHONUNBUFFERED: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

concurrency:
  group: mlx-metal-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metal-host:
    name: MLX translated Metal host execution
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CrossTL and test dependencies
        run: python -m pip install -e . pytest pytest-xdist numpy
      - name: Validate host harness contracts
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: python -m pytest -q -n auto tests/test_mlx_metal_host.py
      - name: Validate Metal argument inference
        env:
          CROSTL_REQUIRE_METAL_ARGUMENT_INFERENCE: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-metal-host/argument-inference
          python tools/run_bounded_command.py --timeout-seconds 120 --label "Native argument inference" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-metal-host/argument-inference/pytest \
              --junitxml=.mlx-metal-host/argument-inference/results.xml \
              tests/test_translator/test_project_metal_discovery.py \
              2>&1 | tee .mlx-metal-host/argument-inference.log
      - name: Validate native float atomics
        env:
          CROSTL_REQUIRE_METAL_FLOAT_ATOMICS: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-metal-host/float-atomics
          python tools/run_bounded_command.py --timeout-seconds 180 --label "Native float atomics" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-metal-host/float-atomics/pytest \
              --junitxml=.mlx-metal-host/float-atomics/results.xml \
              tests/test_translator/test_metal_float_atomics.py \
              tests/test_translator/test_directx_float_atomics.py::test_original_metal_matches_atomic_oracle \
              2>&1 | tee .mlx-metal-host/float-atomics.log
      - name: Checkout pinned upstream MLX
        run: |
          git init mlx-upstream
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
      - name: Compile pinned MLX gated-delta backward entry
        env:
          CROSTL_REQUIRE_MLX_GATED_DELTA_METAL: "1"
          CROSTL_MLX_CURRENT_ROOT: mlx-upstream
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-metal-host/gated-delta
          python tools/run_bounded_command.py --timeout-seconds 300 --label "MLX gated-delta compilation" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-metal-host/gated-delta/pytest \
              --junitxml=.mlx-metal-host/gated-delta/results.xml \
              tests/test_translator/test_mlx_gated_delta_metal.py \
              2>&1 | tee .mlx-metal-host/gated-delta.log
      - name: Execute pinned MLX gated-delta gradients
        env:
          CROSTL_REQUIRE_MLX_GATED_DELTA_RUNTIME: "1"
          CROSTL_MLX_CURRENT_ROOT: mlx-upstream
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-metal-host/gated-delta-runtime
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX gated-delta gradients" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-metal-host/gated-delta-runtime/pytest \
              --junitxml=.mlx-metal-host/gated-delta-runtime/results.xml \
              tests/test_translator/test_mlx_gated_delta_runtime.py \
              2>&1 | tee .mlx-metal-host/gated-delta-runtime.log
      - name: Execute pinned MLX attention row dots
        env:
          CROSTL_REQUIRE_MLX_ATTENTION_RUNTIME: "1"
          CROSTL_MLX_ATTENTION_TARGET: metal
          CROSTL_MLX_CURRENT_ROOT: mlx-upstream
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-metal-host/attention-odo
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX Metal attention row dots" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-metal-host/attention-odo/pytest \
              --junitxml=.mlx-metal-host/attention-odo/results.xml \
              tests/test_translator/test_mlx_attention_odo_runtime.py \
              2>&1 | tee .mlx-metal-host/attention-odo.log
      - name: Execute pinned MLX attention derivatives
        env:
          CROSTL_REQUIRE_MLX_ATTENTION_DS_RUNTIME: "1"
          CROSTL_MLX_ATTENTION_DS_TARGET: metal
          CROSTL_MLX_CURRENT_ROOT: mlx-upstream
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-metal-host/attention-ds
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX Metal attention derivatives" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-metal-host/attention-ds/pytest \
              --junitxml=.mlx-metal-host/attention-ds/results.xml \
              tests/test_translator/test_mlx_attention_ds_runtime.py \
              2>&1 | tee .mlx-metal-host/attention-ds.log
      - name: Prepare isolated MLX build
        run: |
          python -m venv mlx-env
          mlx-env/bin/python -m pip install setuptools wheel cmake ninja nanobind numpy packaging
          python demos/integrations/mlx/run_mlx_metal_host.py prepare \
            --mlx-root mlx-upstream --output-dir .mlx-metal-host/preparation
      - name: Build adapted upstream MLX
        env:
          CMAKE_ARGS: "-DMLX_METAL_JIT=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 \
            --label "MLX adapted host build" -- \
            mlx-env/bin/python -m pip install -e ./mlx-upstream --no-build-isolation -v \
            2>&1 | tee .mlx-metal-host/build.log
      - name: Execute unchanged upstream operations with translated Metal
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3300 \
            --label "MLX translated host verification" -- \
            python demos/integrations/mlx/run_mlx_metal_host.py verify \
              --mlx-root mlx-upstream --python mlx-env/bin/python \
              --output-dir .mlx-metal-host/evidence \
              2>&1 | tee .mlx-metal-host/verification.log
      - name: Retain native host execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-metal-host-${{ github.run_attempt }}
          path: |
            .mlx-metal-host
            mlx-upstream/.host-metal-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
