            --junitxml=.mlx-portable-host/host-abi.xml \
            demos/integrations/mlx/tests/host/test_portable_host.py::test_callback_reports_bounded_error_without_unwinding \
            demos/integrations/mlx/tests/host/test_portable_host.py::test_native_callback_preserves_multidimensional_launch \
