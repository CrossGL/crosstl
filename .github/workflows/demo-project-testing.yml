    name: MLX complete unary OpenGL translation (shard ${{ matrix.shard_index }} of 5)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout CrossTL
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CrossTL and OpenGL SPIR-V validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          python -m pip install --upgrade pip
          python -m pip install -e . pytest-xdist
          glslangValidator --version
          spirv-val --version

      - name: Checkout current MLX unary corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ml-explore/mlx.git mlx-current-upstream
          git -C mlx-current-upstream config core.autocrlf false
          git -C mlx-current-upstream sparse-checkout init --cone
          git -C mlx-current-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-current-upstream checkout --detach "$MLX_CORPUS_COMMIT"
          test "$(git -C mlx-current-upstream rev-parse HEAD)" = "$MLX_CORPUS_COMMIT"

      - name: Prove current MLX complete unary family OpenGL translation
        env:
          CROSTL_KEEP_CORPUS_EVIDENCE: "1"
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_UNARY_OPENGL_TRANSLATION: "1"
          CROSTL_MLX_UNARY_OPENGL_SHARD_INDEX: ${{ matrix.shard_index }}
          CROSTL_MLX_UNARY_OPENGL_SHARD_COUNT: "5"
        run: >-
          python -m pytest -q -n auto
          --junitxml=unary-opengl-junit.xml
          demos/integrations/mlx/tests/kernels/test_unary_complete_opengl.py::test_current_mlx_unary_family_translates_to_opengl

      - name: Upload unary OpenGL corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-unary-opengl-corpus-${{ matrix.shard_index }}
          path: |
            mlx-current-upstream/.crosstl-corpus-evidence
            unary-opengl-junit.xml
          include-hidden-files: true
