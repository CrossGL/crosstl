            python -m demos.integrations.mlx.portable_host.verify_random --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --random .mlx-portable-small-rows/random-packages \
              --reductions .mlx-portable-small-rows/random-reductions --output-dir .mlx-portable-small-rows/random-evidence \
              2>&1 | tee .mlx-portable-small-rows/random-verification.log
      - name: Retain small-row execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-small-rows-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-small-rows
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

