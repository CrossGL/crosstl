      - name: Execute affine quantization through MLX
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pytest -q -n auto demos/integrations/mlx/tests/host/test_portable_quantization.py -k 'not native_host'
          fi
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX affine host verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_quantization --mlx-root mlx-upstream \
              --packages .mlx-portable-half/base/packages --output-dir .mlx-portable-half/affine \
              2>&1 | tee .mlx-portable-half/affine.log
      - name: Execute block quantization through MLX
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
          CROSTL_DIRECTX_FORCE_WARP: "1"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pytest -q -n auto demos/integrations/mlx/tests/host/test_portable_block_quantization.py
          fi
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX block host verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_block_quantization --mlx-root mlx-upstream \
              --packages .mlx-portable-half/base/packages --output-dir .mlx-portable-half/block \
              2>&1 | tee .mlx-portable-half/block.log
      - name: Translate half host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "MLX half translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family half --output-dir .mlx-portable-half/half-packages \
              2>&1 | tee .mlx-portable-half/translation.log
      - name: Execute half host operations
        env:
          PYOPENGL_PLATFORM: egl
          LIBGL_ALWAYS_SOFTWARE: "1"
          CROSTL_DIRECTX_FORCE_WARP: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "MLX half verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_half --mlx-root mlx-upstream \
              --packages .mlx-portable-half/base/packages --half .mlx-portable-half/half-packages \
              --output-dir .mlx-portable-half/evidence 2>&1 | tee .mlx-portable-half/verification.log
      - name: Translate half arithmetic packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX half arithmetic translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family half-arithmetic --output-dir .mlx-portable-half/arithmetic-packages \
              2>&1 | tee .mlx-portable-half/arithmetic-translation.log
      - name: Translate random prerequisites for half arithmetic
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX half random prerequisites" -- \
            python -m demos.integrations.mlx.portable_host.random_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --output-dir .mlx-portable-half/random-packages \
              2>&1 | tee .mlx-portable-half/random-translation.log
      - name: Execute half arithmetic and upstream distribution test
        env:
          PYOPENGL_PLATFORM: egl
          LIBGL_ALWAYS_SOFTWARE: "1"
          CROSTL_DIRECTX_FORCE_WARP: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 2100 --label "MLX half arithmetic verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_half_arithmetic --mlx-root mlx-upstream \
              --packages .mlx-portable-half/base/packages --half .mlx-portable-half/half-packages \
              --arithmetic .mlx-portable-half/arithmetic-packages --random .mlx-portable-half/random-packages \
              --output-dir .mlx-portable-half/arithmetic-evidence 2>&1 | tee .mlx-portable-half/arithmetic-verification.log
      - name: Translate bfloat host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX bfloat translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family bfloat --output-dir .mlx-portable-half/bfloat-packages \
              2>&1 | tee .mlx-portable-half/bfloat-translation.log
      - name: Execute bfloat host operations
        env:
          PYOPENGL_PLATFORM: egl
          LIBGL_ALWAYS_SOFTWARE: "1"
          CROSTL_DIRECTX_FORCE_WARP: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "MLX bfloat verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_bfloat --mlx-root mlx-upstream \
              --packages .mlx-portable-half/base/packages --bfloat .mlx-portable-half/bfloat-packages \
              --output-dir .mlx-portable-half/bfloat-evidence 2>&1 | tee .mlx-portable-half/bfloat-verification.log
      - name: Translate bfloat reduction packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "Bfloat reduction translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family bfloat --width 32 --width 128 --width 256 \
              --output-dir .mlx-portable-half/bfloat-reductions \
              2>&1 | tee .mlx-portable-half/bfloat-reductions-translation.log
      - name: Execute bfloat reductions
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "Bfloat reduction verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_bfloat_reductions --mlx-root mlx-upstream \
              --packages .mlx-portable-half/base/packages --bfloat .mlx-portable-half/bfloat-packages \
              --reductions .mlx-portable-half/bfloat-reductions --output-dir .mlx-portable-half/bfloat-reductions-evidence \
              2>&1 | tee .mlx-portable-half/bfloat-reductions-verification.log
      - name: Translate upstream block assertion packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "Block assertion translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --width 32 --width 128 --width 256 \
              --entry all_reduce_andbool_ --entry all_reduce_maxfloat32 \
              --output-dir .mlx-portable-half/block-assertion-reductions \
              2>&1 | tee .mlx-portable-half/block-assertion-translation.log
      - name: Execute unchanged upstream block tests
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
          CROSTL_DIRECTX_FORCE_WARP: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 2100 --label "Upstream block tests" -- \
            python -m demos.integrations.mlx.portable_host.verify_upstream_blocks --mlx-root mlx-upstream \
              --packages .mlx-portable-half/base/packages --random .mlx-portable-half/random-packages \
              --bfloat .mlx-portable-half/bfloat-packages --reductions .mlx-portable-half/bfloat-reductions \
              --reductions .mlx-portable-half/block-assertion-reductions \
              --output-dir .mlx-portable-half/upstream-blocks \
              2>&1 | tee .mlx-portable-half/upstream-blocks.log
      - name: Retain half execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-half-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-half
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  integer64-host:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-integer64-host-${{ strategy.job-index }}
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

    name: MLX integer64 host (${{ matrix.target }})
    needs: portable-host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
          - os: windows-2025
            target: directx
          - os: macos-26
            target: metal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize integer64 evidence
        run: mkdir -p .mlx-portable-integer64
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-integer64/dependencies.log
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: python -m pip install moderngl PyOpenGL
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-integer64/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-integer64/swift-version.txt
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Select same-run host packages
        uses: actions/github-script@v7
        id: host-artifact
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const prefix = `mlx-portable-host-${process.env.MLX_TARGET}-`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const candidates = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
              && /^\d+$/.test(item.name.slice(prefix.length)));
            candidates.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
            if (!candidates.length) throw new Error("The required host proof artifact is missing.");
            core.setOutput("id", candidates[0].id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.host-artifact.outputs.id }}
          path: .mlx-portable-integer64/base
          merge-multiple: true
      - name: Prepare pinned MLX
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-integer64/adaptation.json
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX integer64 host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-integer64/build.log
      - name: Translate integer64 host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 7200 --label "MLX integer64 translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family integer64 --output-dir .mlx-portable-integer64/integer64-packages \
              2>&1 | tee .mlx-portable-integer64/integer64-translation.log
      - name: Translate integer64 test companions
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX integer absolute translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family absolute --output-dir .mlx-portable-integer64/absolute-packages \
              2>&1 | tee .mlx-portable-integer64/absolute-translation.log
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX integer64 Boolean reduction translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --entry all_reduce_andbool_ --width 32 \
              --output-dir .mlx-portable-integer64/reductions 2>&1 | tee .mlx-portable-integer64/reductions.log
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX integer64 empty reduction translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family init --entry init_reduce_andbool_ --width 1 \
              --output-dir .mlx-portable-integer64/init-packages 2>&1 | tee .mlx-portable-integer64/init-translation.log
      - name: Execute integer64 host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3000 --label "MLX integer64 verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_integer64 --mlx-root mlx-upstream \
              --packages .mlx-portable-integer64/base/packages --integer64 .mlx-portable-integer64/integer64-packages \
              --absolute .mlx-portable-integer64/absolute-packages --reductions .mlx-portable-integer64/reductions \
              --reductions .mlx-portable-integer64/init-packages --output-dir .mlx-portable-integer64/evidence \
              2>&1 | tee .mlx-portable-integer64/verification.log
      - name: Translate padding test companion
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX padding Boolean reduction translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --entry all_reduce_andbool_ --width 64 \
              --output-dir .mlx-portable-integer64/padding-reductions \
              2>&1 | tee .mlx-portable-integer64/padding-translation.log
      - name: Execute padding and slice updates
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3000 --label "MLX padding verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_padding --mlx-root mlx-upstream \
              --packages .mlx-portable-integer64/base/packages --integer64 .mlx-portable-integer64/integer64-packages \
              --reductions .mlx-portable-integer64/reductions --reductions .mlx-portable-integer64/padding-reductions \
              --output-dir .mlx-portable-integer64/padding-evidence \
              2>&1 | tee .mlx-portable-integer64/padding-verification.log
      - name: Retain integer64 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-integer64-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-integer64
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

