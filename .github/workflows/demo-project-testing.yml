        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 300 --label "MLX row package collection" -- \
            python -m demos.integrations.mlx.portable_host.reduction_shards collect \
              --directory .mlx-portable-reductions/packages --target "${{ matrix.target }}" \
              2>&1 | tee .mlx-portable-reductions/collection.log
      - name: Compile every row variant natively
        if: matrix.family == 'row'
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 7200 --label "MLX row native compilation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_shards compile \
              --directory .mlx-portable-reductions/packages --target "${{ matrix.target }}" \
              --output-dir .mlx-portable-reductions/compiled \
              2>&1 | tee .mlx-portable-reductions/compilation.log
      - name: Translate whole-array companions for mixed workloads
        if: matrix.family == 'row'
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "MLX mixed reduction packages" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --family all --width 32 --jobs 2 \
              --output-dir .mlx-portable-reductions/companions 2>&1 | tee .mlx-portable-reductions/companion-translation.log
      - name: Execute MLX reductions
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds ${{ matrix.verification_timeout || 5400 }} --label "MLX reduction host verification" -- \
            python -m demos.integrations.mlx.portable_host.${{ matrix.verifier }} --mlx-root mlx-upstream \
              --packages .mlx-portable-reductions/base/packages --reductions .mlx-portable-reductions/packages \
              ${{ matrix.companion_args }} --output-dir .mlx-portable-reductions/evidence 2>&1 | tee .mlx-portable-reductions/verification.log
      - name: Retain reduction execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-${{ matrix.family }}-reductions-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-reductions
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  mlx-metal-porting:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-mlx-metal-porting-${{ strategy.job-index }}
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "4367c73b60541ddd5a266ce4644fd93d20223b6e"
      MLX_CORPUS_COMMIT: "846d176227a0ac13d2667e58d2bb68b322109ab0"
      MLX_CURRENT_TREE_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"

    name: MLX Metal project porting (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout CrossTL
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest-xdist "PyYAML>=6,<7"

      - name: Install macOS Metal Toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version

      - name: Validate bounded MLX dispatch contracts
        run: python -m pytest -q -n auto demos/integrations/mlx/tests/test_dispatch_contract_fixture.py demos/integrations/mlx/tests/test_logsumexp_dispatch_contract_fixture.py

      - name: Validate native dispatch limits
        run: python -m pytest -q -n auto tests/test_translator/test_native_dispatch_limits.py

      - name: Install Linux SPIR-V tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libopengl0 mesa-vulkan-drivers spirv-tools vulkan-tools
          glslangValidator --version

      - name: Install Linux DXC
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-dxc

      - name: Validate OpenGL lowering contracts
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest
          python -m pytest -q -n auto tests/test_translator/test_codegen/test_GLSL_codegen.py \
            -k "opengl_lowers_expected_scalar_and_vector_conversions or opengl_broadcasts_scalar_literals_to_vector_assignments or opengl_preserves_metal_arithmetic_conversion_order or opengl_helper_parameters_preserve_out_and_inout_qualifiers or glsl_atomic_thread_fence"
          python -m pytest -q -n auto tests/test_translator/test_project_translation.py \
            -k "translate_project_reports_unrepresentable_atomic_fence_contract"

      - name: Install Windows DirectX Shader Compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc"
          $dxcUri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $dxcUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "DXC download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          Expand-Archive -Path $archive -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem -Path $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match "\\bin\\x64\\dxc.exe$" } |
            Select-Object -First 1
          if ($null -eq $dxc) {
            throw "dxc.exe not found in release archive."
          }
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prove native artifact contract refresh
        env:
          CROSTL_REQUIRE_ARTIFACT_REFRESH_COMPILER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_artifact_contract_refresh.py
          --basetemp support/generated/artifact-refresh-native
          --junitxml support/generated/artifact-refresh-native.xml

      - name: Upload native artifact refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-refresh-native-${{ runner.os }}
          path: |
            support/generated/artifact-refresh-native
            support/generated/artifact-refresh-native.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Install Windows Direct3D runtime dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[directx-runtime]" pytest-xdist

      - name: Install pinned Windows WARP runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $warpVersion = "1.0.21"
          $warpSha256 = "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681"
          $archive = Join-Path $env:RUNNER_TEMP "microsoft.direct3d.warp.$warpVersion.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "microsoft.direct3d.warp.$warpVersion"
          $warpUri = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/$warpVersion/microsoft.direct3d.warp.$warpVersion.nupkg"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $warpUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "WARP download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $archiveSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne $warpSha256) {
            throw "WARP archive checksum mismatch: expected $warpSha256, got $archiveSha256."
          }
          Expand-Archive -Path $archive -DestinationPath $warpRoot -Force
          $warp = Join-Path $warpRoot "build\native\bin\x64\d3d10warp.dll"
          if (-not (Test-Path -Path $warp -PathType Leaf)) {
            throw "d3d10warp.dll not found in WARP package."
          }
          $pythonWarp = Join-Path $env:pythonLocation "d3d10warp.dll"
          Copy-Item -Path $warp -Destination $pythonWarp -Force
          Write-Host "Installed WARP $((Get-Item $pythonWarp).VersionInfo.FileVersion) beside python.exe."
          Write-Host "WARP DLL SHA256: $((Get-FileHash -Path $pythonWarp -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Validate Direct3D Metal math semantics
        if: runner.os == 'Windows'
        shell: bash
        env:
          CROSTL_REQUIRE_DIRECTX_METAL_MATH: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p directx-math-results
          python tools/run_bounded_command.py \
            --label "Direct3D Metal math semantics" \
            --timeout-seconds 120 -- \
            python tools/run_directx_diagnostics.py \
              --output "directx-math-results/directx.jsonl" \
              --module pytest -- \
              -vv -s --tb=long -o faulthandler_timeout=60 \
              --basetemp="directx-math-results/pytest" \
              --junitxml="directx-math-results/results.xml" \
              tests/test_translator/test_directx_metal_math.py::test_directx_metal_math_executes

      - name: Upload Direct3D Metal math evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: directx-metal-math
          path: directx-math-results
          if-no-files-found: error
          retention-days: 14

      - name: Validate Direct3D reduction primitives
        if: runner.os == 'Windows'
        shell: bash
        env:
          CROSTL_REQUIRE_DIRECTX_REDUCTION_PRIMITIVES: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p mlx-current-results
          failed=0
          for case in metadata division shuffle combined pair-reduction special-values two-phase private-array; do
            python tools/run_bounded_command.py \
              --label "Direct3D reduction primitive $case" \
              --timeout-seconds 120 -- \
              python tools/run_directx_diagnostics.py \
                --output "mlx-current-results/primitive-$case-directx.jsonl" \
                --module pytest -- \
                -vv -s --tb=long -o faulthandler_timeout=60 \
                --basetemp="mlx-current-results/primitive-$case" \
                --junitxml="mlx-current-results/primitive-$case.xml" \
                "tests/test_translator/test_directx_reduction_primitives.py::test_directx_reduction_primitives_execute[$case]" \
                || failed=1
          done
          exit "$failed"

      - name: Upload Direct3D reduction primitive diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: directx-reduction-primitives
          path: mlx-current-results
          if-no-files-found: warn
          retention-days: 14

      - name: Validate atan2 signed-zero semantics
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        env:
          CROSTL_REQUIRE_DIRECTX_ATAN2: ${{ runner.os == 'Windows' && '1' || '0' }}
          CROSTL_REQUIRE_METAL_ATAN2: ${{ runner.os == 'macOS' && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p atan2-results
          python tools/run_bounded_command.py \
            --label "atan2 signed-zero semantics" --timeout-seconds 120 -- \
            python -m pytest -q -n auto \
              --basetemp="atan2-results/pytest" \
              --junitxml="atan2-results/results.xml" \
              tests/test_translator/test_directx_atan2.py

      - name: Upload atan2 signed-zero evidence
        if: always() && (runner.os == 'Windows' || runner.os == 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: atan2-signed-zero-${{ runner.os }}
          path: atan2-results
          if-no-files-found: error
          retention-days: 14

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install moderngl==5.12.0 PyOpenGL==3.1.10 pytest-xdist vulkan==1.3.275.1

      - name: Validate OpenGL Metal math semantics
        if: runner.os == 'Linux'
        env:
          CROSTL_REQUIRE_OPENGL_METAL_MATH: "1"
          CROSTL_REQUIRE_FLOATING_REMAINDER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          EGL_PLATFORM: surfaceless
        run: |
          mkdir -p opengl-math-results
          python tools/run_bounded_command.py \
            --label "OpenGL Metal math semantics" \
            --timeout-seconds 120 -- \
            python -m pytest -q -n auto \
              --basetemp="opengl-math-results/pytest" \
              --junitxml="opengl-math-results/results.xml" \
              tests/test_translator/test_opengl_metal_math.py \
              tests/test_translator/test_floating_remainder_math.py

      - name: Upload OpenGL Metal math evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: opengl-metal-math
          path: opengl-math-results
          if-no-files-found: error
          retention-days: 14

      - name: Validate native Metal package execution
        if: runner.os == 'macOS'
        env:
          CROSTL_REQUIRE_METAL_PACKAGE_RUNTIME: "1"
          CROSTL_REQUIRE_METAL_HELPER_LINKAGE: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          mkdir -p metal-package-results
          python tools/run_bounded_command.py \
            --label "native Metal package execution" --timeout-seconds 300 -- \
            python -m pytest -q -n auto \
              --basetemp="metal-package-results/pytest" \
              --junitxml="metal-package-results/results.xml" \
              tests/test_translator/test_metal_native_runtime.py \
              tests/test_translator/test_metal_worker_cache.py \
              tests/test_translator/test_exact_thread_grid_runtime.py \
              tests/test_translator/test_metal_helper_linkage.py

      - name: Upload native Metal package evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: metal-native-package
          path: metal-package-results
          if-no-files-found: error
          retention-days: 14

      - name: Validate DirectX compiler paths
        if: runner.os == 'Windows'
        shell: bash
        env:
          CROSTL_REQUIRE_DXC_PATHS: "1"
        run: |
          set -euo pipefail
          mkdir -p directx-path-results
          python tools/run_bounded_command.py \
            --label "DirectX compiler paths" --timeout-seconds 90 -- \
            python -m pytest -q -n auto \
              --basetemp="directx-path-results/pytest" \
              --junitxml="directx-path-results/results.xml" \
              tests/test_translator/test_directx_toolchain_paths.py

      - name: Upload DirectX compiler path evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: directx-compiler-paths
          path: directx-path-results
          if-no-files-found: error
          retention-days: 14

      - name: Validate Metal builtin ownership
        shell: bash
        env:
          CROSTL_REQUIRE_METAL_BUILTIN_OWNERSHIP: "1"
          CROSTL_REQUIRE_METAL_PRECISE_ASIN: "1"
          CROSTL_REQUIRE_METAL_PRECISE_TRIG: "1"
          CROSTL_REQUIRE_FLOAT_NEGATION: "1"
          CROSTL_REQUIRE_UNARY_GROUPING: "1"
          CROSTL_REQUIRE_BINARY_GROUPING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          EGL_PLATFORM: surfaceless
        run: |
          set -euo pipefail
          mkdir -p metal-ownership-results
          python tools/run_bounded_command.py \
            --label "Metal builtin ownership" --timeout-seconds 120 -- \
            python -m pytest -q -n auto \
              --basetemp="metal-ownership-results/pytest" \
              --junitxml="metal-ownership-results/results.xml" \
              tests/test_translator/test_metal_builtin_ownership.py \
              tests/test_translator/test_metal_trunc.py \
              tests/test_translator/test_metal_signbit.py \
              tests/test_translator/test_metal_precise_asin.py \
              tests/test_translator/test_metal_precise_trig.py \
              tests/test_translator/test_float_negation.py \
              tests/test_translator/test_unary_grouping.py \
              tests/test_translator/test_binary_grouping.py

      - name: Upload Metal builtin ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-builtin-ownership-${{ runner.os }}
          path: metal-ownership-results
          if-no-files-found: error
          retention-days: 14

      - name: Validate scalar alias resolution
        shell: bash
        env:
          CROSTL_REQUIRE_SCALAR_ALIASES: "1"
          CROSTL_REQUIRE_DEVICE_REFERENCES: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          EGL_PLATFORM: surfaceless
        run: |
          set -euo pipefail
          mkdir -p scalar-alias-results
          python tools/run_bounded_command.py \
            --label "Scalar alias resolution" --timeout-seconds 120 -- \
            python -m pytest -q -n auto \
              --basetemp="scalar-alias-results/pytest" \
              --junitxml="scalar-alias-results/results.xml" \
              tests/test_translator/test_scalar_aliases.py \
              tests/test_translator/test_metal_conversion_operators.py \
              tests/test_translator/test_storage_wrapper_loads.py \
              tests/test_translator/test_metal_buffer_references.py

      - name: Upload scalar alias evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalar-alias-resolution-${{ runner.os }}
          path: scalar-alias-results
          if-no-files-found: error
          retention-days: 14

      - name: Validate DirectX allocation views
        if: runner.os == 'Windows'
        shell: bash
        env:
          CROSTL_REQUIRE_DIRECTX_BUFFER_VIEWS: "1"
        run: |
          set -euo pipefail
          mkdir -p directx-buffer-view-results
          python tools/run_bounded_command.py \
            --label "DirectX allocation views" --timeout-seconds 180 -- \
            python -m pytest -q -n auto \
              --basetemp="directx-buffer-view-results/pytest" \
              --junitxml="directx-buffer-view-results/results.xml" \
              tests/test_translator/test_directx_buffer_views.py

      - name: Upload DirectX allocation view evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: directx-buffer-views-Windows
          path: directx-buffer-view-results
          if-no-files-found: error
          retention-days: 14

      - name: Checkout pinned MLX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-upstream
          git clone --filter=blob:none --no-checkout https://github.com/ml-explore/mlx.git mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream sparse-checkout init --cone
          git -C mlx-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-upstream checkout "$MLX_COMMIT"

      - name: Validate binary32 arithmetic
        shell: bash
        env:
          CROSTL_REQUIRE_FUSED_MATH: "1"
          CROSTL_REQUIRE_HALF_REMAINDER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          EGL_PLATFORM: surfaceless
        run: |
          set -euo pipefail
          mkdir -p fused-math-results
          python tools/run_bounded_command.py \
            --label "binary32 arithmetic" --timeout-seconds 120 -- \
            python -m pytest -q -n auto \
              --basetemp="fused-math-results/pytest" \
              --junitxml="fused-math-results/results.xml" \
              tests/test_translator/test_fused_math.py \
              tests/test_translator/test_metal_fma.py \
              tests/test_translator/test_metal_half_remainder.py::test_half_remainder_profile_executes \
              tests/test_translator/test_metal_arithmetic_ownership.py::test_arithmetic_builtin_ownership_executes

      - name: Upload binary32 arithmetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary32-fused-arithmetic-${{ runner.os }}
          path: fused-math-results
          if-no-files-found: error
          retention-days: 14

      - name: Checkout current MLX runtime proof corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-current-upstream
          git clone --filter=blob:none --no-checkout https://github.com/ml-explore/mlx.git mlx-current-upstream
          git -C mlx-current-upstream config core.autocrlf false
          git -C mlx-current-upstream sparse-checkout init --cone
          git -C mlx-current-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-current-upstream checkout --detach "$MLX_CORPUS_COMMIT"
          test "$(git -C mlx-current-upstream rev-parse HEAD)" = "$MLX_CORPUS_COMMIT"

      - name: Checkout current MLX kernel tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-current-tree-upstream
          git clone --filter=blob:none --no-checkout https://github.com/ml-explore/mlx.git mlx-current-tree-upstream
          git -C mlx-current-tree-upstream config core.autocrlf false
          git -C mlx-current-tree-upstream sparse-checkout init --cone
          git -C mlx-current-tree-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-current-tree-upstream checkout --detach "$MLX_CURRENT_TREE_COMMIT"
          test "$(git -C mlx-current-tree-upstream rev-parse HEAD)" = "$MLX_CURRENT_TREE_COMMIT"

      - name: Audit current MLX kernel census
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python demos/integrations/mlx/discover_entries.py \
            --mlx-root mlx-current-tree-upstream \
            --expected-commit "$MLX_CURRENT_TREE_COMMIT" \
            --expected-unit-count 49 \
            --expected-entry-count 17832

      - name: Validate pinned unary arithmetic
        shell: bash
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-current-tree-upstream
          CROSTL_REQUIRE_MLX_CURRENT_UNARY_FMA: "1"
          CROSTL_REQUIRE_MLX_CURRENT_UNARY_TRIG: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) export CROSTL_MLX_CURRENT_TARGET=opengl ;;
            Windows) export CROSTL_MLX_CURRENT_TARGET=directx ;;
            macOS) export CROSTL_MLX_CURRENT_TARGET=metal ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          mkdir -p mlx-unary-fma-results
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Pinned unary fused arithmetic" -- \
            python -m pytest -q -n auto \
              --basetemp=mlx-unary-fma-results/pytest \
              --junitxml=mlx-unary-fma-results/results.xml \
              demos/integrations/mlx/tests/kernels/test_current_unary_fma.py \
              demos/integrations/mlx/tests/kernels/test_current_unary_trig.py

      - name: Upload pinned unary fused arithmetic evidence
        if: always()
