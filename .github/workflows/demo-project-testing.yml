name: Project Demo Testing
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/demo-project-testing.yml"
      - ".github/actionlint.yaml"
      - ".pre-commit-config.yaml"
      - "crosstl/**"
      - "demos/integrations/**"
      - "tests/**"
      - "tools/**"
      - "support/**"
      - "conftest.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.cfg"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/demo-project-testing.yml"
      - ".github/actionlint.yaml"
      - ".pre-commit-config.yaml"
      - "crosstl/**"
      - "demos/integrations/**"
      - "tests/**"
      - "tools/**"
      - "support/**"
      - "conftest.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.cfg"
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  opengl:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-opengl
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"

    name: Translated OpenGL indexed gather
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenGL runtime and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
          python -m pip install -e . pytest pytest-xdist numpy moderngl PyOpenGL "PyYAML>=6,<7"
      - name: Checkout pinned upstream MLX
        run: |
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
      - name: Validate indexed OpenGL gather and resource aggregates
        env:
          CROSTL_REQUIRE_HALF_BUFFER_RUNTIME: "1"
          CROSTL_REQUIRE_BFLOAT_BUFFER_RUNTIME: "1"
          CROSTL_REQUIRE_BFLOAT_CONVERSION_RUNTIME: "1"
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_REQUIRE_MLX_OPENGL_GENERAL_GATHER: "1"
          CROSTL_REQUIRE_RANGE_BINDINGS: "1"
          CROSTL_REQUIRE_UNION_STORAGE: "1"
          CROSTL_REQUIRE_NARROW_INTEGER_CONVERSIONS: "1"
          CROSTL_REQUIRE_VECTOR_LIST_INITIALIZATION: "1"
          CROSTL_REQUIRE_OPENGL_RESOURCE_AGGREGATES: "1"
          CROSTL_REQUIRE_OPENGL_FLOAT_ATOMIC_STORAGE: "1"
          CROSTL_REQUIRE_VOID_RETURN_EFFECTS: "1"
          CROSTL_REQUIRE_TEMPLATE_WRAPPER_RUNTIME: "1"
          CROSTL_REQUIRE_FUNCTOR_MEMBER_RUNTIME: "1"
          CROSTL_REQUIRE_CONSTRAINED_SPECIALIZATION_RUNTIME: "1"
          CROSTL_REQUIRE_POINTER_OFFSET_RUNTIME: "1"
          CROSTL_REQUIRE_ATOMIC_RESOURCE_RUNTIME: "1"
          CROSTL_REQUIRE_MLX_GENERAL_SCATTER: "1"
          CROSTL_REQUIRE_ATOMIC_STORE_RUNTIME: "1"
          CROSTL_REQUIRE_ATOMIC_LOAD_RUNTIME: "1"
          CROSTL_REQUIRE_ATOMIC_COMPARE_EXCHANGE_RUNTIME: "1"
          CROSTL_REQUIRE_METAL_CONSTEXPR_RUNTIME: "1"
          CROSTL_REQUIRE_METAL_CONSTRAINED_RUNTIME: "1"
          CROSTL_REQUIRE_MLX_SCATTER_AXIS: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-gather-opengl
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "Native OpenGL indexed gather" -- \
            python -m pytest -q -n auto --dist loadgroup --durations=20 \
              --basetemp=.mlx-gather-opengl/pytest \
              --junitxml=.mlx-gather-opengl/results.xml \
              demos/integrations/mlx/tests/kernels/test_general_gather_opengl.py \
              tests/test_translator/test_half_buffer_runtime.py \
              tests/test_translator/test_bfloat_buffer_runtime.py \
              tests/test_translator/test_opengl_bfloat_conversion.py \
              tests/test_translator/test_bfloat_constants.py \
              tests/test_translator/test_wide_integer_bfloat.py \
              tests/test_translator/test_half_copy_identity.py \
              tests/test_translator/test_range_bindings.py \
              tests/test_translator/test_union_storage.py \
              tests/test_translator/test_narrow_integer_conversions.py \
              tests/test_translator/test_vector_list_initialization.py \
              tests/test_translator/test_float_atomic_memory.py \
              tests/test_translator/test_float_atomic_compare_exchange.py \
              tests/test_translator/test_opengl_float_atomic_storage.py \
              demos/integrations/mlx/tests/kernels/test_float_atomic_storage_opengl.py \
              tests/test_translator/test_resource_aggregates_opengl.py \
              tests/test_translator/test_void_return_effects.py \
              tests/test_translator/test_template_wrapper_runtime.py \
              tests/test_translator/test_functor_member_runtime.py \
              tests/test_translator/test_constrained_specialization_runtime.py \
              tests/test_translator/test_pointer_offset_address_spaces.py \
              tests/test_translator/test_atomic_resource_runtime.py \
              demos/integrations/mlx/tests/kernels/test_general_scatter_runtime.py \
              tests/test_translator/test_atomic_store_runtime.py \
              tests/test_translator/test_atomic_load_runtime.py \
              demos/integrations/mlx/tests/kernels/test_atomic_load_runtime.py \
              tests/test_translator/test_atomic_compare_exchange_runtime.py \
              demos/integrations/mlx/tests/kernels/test_atomic_compare_exchange_runtime.py \
              tests/test_translator/test_metal_constexpr_branches.py \
              tests/test_translator/test_metal_constrained_calls.py \
              demos/integrations/mlx/tests/kernels/test_scatter_axis_runtime.py \
              2>&1 | tee .mlx-gather-opengl/execution.log
      - name: Validate OpenGL half conversions
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
          CROSTL_REQUIRE_HALF_CONVERSION_RUNTIME: "1"
          CROSTL_HALF_CONVERSION_TARGET: opengl
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-gather-opengl/half-conversions
          python tools/run_bounded_command.py --timeout-seconds 180 --label "OpenGL half conversions" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-gather-opengl/half-conversions/pytest \
              --junitxml=.mlx-gather-opengl/half-conversions/results.xml \
              tests/test_translator/test_opengl_half_conversion.py \
              2>&1 | tee .mlx-gather-opengl/half-conversions.log
      - name: Validate OpenGL uniform blocks
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
          CROSTL_REQUIRE_UNIFORM_BLOCK_RUNTIME: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-gather-opengl/uniform-blocks
          python tools/run_bounded_command.py --timeout-seconds 180 --label "OpenGL uniform blocks" -- \
            python -m pytest -q -n auto \
              --basetemp=.mlx-gather-opengl/uniform-blocks/pytest \
              --junitxml=.mlx-gather-opengl/uniform-blocks/results.xml \
              tests/test_translator/test_uniform_block_layouts.py \
              2>&1 | tee .mlx-gather-opengl/uniform-blocks.log
      - name: Validate translated OpenGL random kernels
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Native OpenGL random kernels" -- \
            python -m demos.integrations.mlx.random_audit \
              --mlx-root mlx-upstream --target opengl --output-dir .mlx-gather-opengl/random \
              2>&1 | tee .mlx-gather-opengl/random-execution.log
      - name: Validate OpenGL random byte tails
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 450 --label "Native OpenGL random byte tails" -- \
            python -m demos.integrations.mlx.random_audit --byte-tails \
              --mlx-root mlx-upstream --target opengl --output-dir .mlx-gather-opengl/random-byte-tails \
              2>&1 | tee .mlx-gather-opengl/random-byte-tails.log
      - name: Retain OpenGL execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-gather-opengl-${{ github.run_attempt }}
          path: .mlx-gather-opengl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  metal:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-metal
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"

    name: Original and translated Metal gather
    runs-on: macos-26
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CrossTL and test dependencies
        run: python -m pip install -e . pytest pytest-xdist numpy
      - name: Checkout pinned upstream MLX
        run: |
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
      - name: Validate general gather and empty arrays
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_REQUIRE_MLX_GENERAL_GATHER: "1"
          CROSTL_REQUIRE_METAL_EMPTY_ARRAYS: "1"
          CROSTL_REQUIRE_FLOAT_ATOMIC_MEMORY: "1"
          CROSTL_REQUIRE_RESOURCE_AGGREGATES: "1"
          CROSTL_REQUIRE_VOID_RETURN_EFFECTS: "1"
          CROSTL_REQUIRE_TEMPLATE_WRAPPER_RUNTIME: "1"
          CROSTL_REQUIRE_FUNCTOR_MEMBER_RUNTIME: "1"
          CROSTL_REQUIRE_CONSTRAINED_SPECIALIZATION_RUNTIME: "1"
          CROSTL_REQUIRE_POINTER_OFFSET_RUNTIME: "1"
          CROSTL_REQUIRE_ATOMIC_RESOURCE_RUNTIME: "1"
          CROSTL_REQUIRE_MLX_GENERAL_SCATTER: "1"
          CROSTL_REQUIRE_ATOMIC_STORE_RUNTIME: "1"
          CROSTL_REQUIRE_ATOMIC_LOAD_RUNTIME: "1"
          CROSTL_REQUIRE_ATOMIC_COMPARE_EXCHANGE_RUNTIME: "1"
          CROSTL_REQUIRE_METAL_CONSTEXPR_RUNTIME: "1"
          CROSTL_REQUIRE_METAL_CONSTRAINED_RUNTIME: "1"
          CROSTL_REQUIRE_MLX_SCATTER_AXIS: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-gather
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "Native gather round trip" -- \
            python -m pytest -q -n auto --dist loadgroup --durations=20 \
              --basetemp=.mlx-gather/pytest \
              --junitxml=.mlx-gather/results.xml \
              demos/integrations/mlx/tests/kernels/test_general_gather.py \
              tests/test_translator/test_metal_empty_arrays.py \
              tests/test_translator/test_float_atomic_memory.py \
              demos/integrations/mlx/tests/kernels/test_float_atomic_memory.py \
              tests/test_translator/test_resource_aggregates.py \
              tests/test_translator/test_void_return_effects.py \
              tests/test_translator/test_template_wrapper_runtime.py \
              tests/test_translator/test_functor_member_runtime.py \
              tests/test_translator/test_constrained_specialization_runtime.py \
              tests/test_translator/test_pointer_offset_address_spaces.py \
              tests/test_translator/test_atomic_resource_runtime.py \
              demos/integrations/mlx/tests/kernels/test_general_scatter_runtime.py \
              tests/test_translator/test_atomic_store_runtime.py \
              tests/test_translator/test_atomic_load_runtime.py \
              demos/integrations/mlx/tests/kernels/test_atomic_load_runtime.py \
              tests/test_translator/test_atomic_compare_exchange_runtime.py \
              demos/integrations/mlx/tests/kernels/test_atomic_compare_exchange_runtime.py \
              tests/test_translator/test_metal_constexpr_branches.py \
              tests/test_translator/test_metal_constrained_calls.py \
              demos/integrations/mlx/tests/kernels/test_scatter_axis_runtime.py \
              2>&1 | tee .mlx-gather/execution.log
      - name: Validate Metal byte and vector storage
        env:
          CROSTL_REQUIRE_HALF_BUFFER_RUNTIME: "1"
          CROSTL_REQUIRE_BFLOAT_BUFFER_RUNTIME: "1"
          CROSTL_REQUIRE_BFLOAT_CONVERSION_RUNTIME: "1"
          CROSTL_REQUIRE_RANGE_BINDINGS: "1"
          CROSTL_REQUIRE_UNION_STORAGE: "1"
          CROSTL_REQUIRE_NARROW_INTEGER_CONVERSIONS: "1"
          CROSTL_REQUIRE_VECTOR_LIST_INITIALIZATION: "1"
          CROSTL_REQUIRE_BYTE_BUFFER_RUNTIME: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          mkdir -p .mlx-gather/storage
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "Native Metal storage" -- \
            python -m pytest -q -n auto --dist loadgroup --durations=20 \
              --basetemp=.mlx-gather/storage/pytest \
              --junitxml=.mlx-gather/storage/results.xml \
              tests/test_translator/test_range_bindings.py \
              tests/test_translator/test_union_storage.py \
              tests/test_translator/test_narrow_integer_conversions.py \
              tests/test_translator/test_vector_list_initialization.py \
              tests/test_translator/test_byte_buffer_runtime.py \
              tests/test_translator/test_half_buffer_runtime.py \
              tests/test_translator/test_bfloat_buffer_runtime.py \
              tests/test_translator/test_opengl_bfloat_conversion.py \
              tests/test_translator/test_bfloat_constants.py \
              tests/test_translator/test_wide_integer_bfloat.py \
              tests/test_translator/test_half_copy_identity.py \
              tests/test_translator/test_metal_aggregate_lookup.py \
              tests/test_translator/test_metal_narrow_aggregate_runtime.py \
              2>&1 | tee .mlx-gather/storage/execution.log
      - name: Validate translated Metal random kernels
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Native Metal random kernels" -- \
            python -m demos.integrations.mlx.random_audit \
              --mlx-root mlx-upstream --target metal --output-dir .mlx-gather/random \
              2>&1 | tee .mlx-gather/random-execution.log
      - name: Validate Metal random byte tails
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 450 --label "Native Metal random byte tails" -- \
            python -m demos.integrations.mlx.random_audit --byte-tails \
              --mlx-root mlx-upstream --target metal --output-dir .mlx-gather/random-byte-tails \
              2>&1 | tee .mlx-gather/random-byte-tails.log
      - name: Retain original and translated execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-gather-metal-${{ github.run_attempt }}
          path: .mlx-gather
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  metal-float:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-metal-float
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"

      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    name: Original and translated Metal float atomics
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record floating atomic toolchain
        run: |
          set -euo pipefail
          mkdir -p .mlx-float-metal
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -version | tee .mlx-float-metal/xcode-version.txt
          xcrun --sdk macosx metal --version | tee .mlx-float-metal/metal-version.txt
      - name: Install CrossTL and test dependencies
        run: python -m pip install -e . pytest pytest-xdist numpy
      - name: Checkout pinned upstream MLX
        run: |
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
      - name: Validate float compare-exchange and scatter
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_REQUIRE_FLOAT_ATOMIC_COMPARE_EXCHANGE: "1"
          CROSTL_REQUIRE_MLX_FLOAT_SCATTER: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "Native Metal float atomics" -- \
            python -m pytest -q -n auto --dist loadgroup --durations=20 \
              --basetemp=.mlx-float-metal/pytest \
              --junitxml=.mlx-float-metal/results.xml \
              tests/test_translator/test_float_atomic_compare_exchange.py \
              demos/integrations/mlx/tests/kernels/test_float_atomic_compare_exchange.py \
              demos/integrations/mlx/tests/kernels/test_float_scatter_runtime.py \
              2>&1 | tee .mlx-float-metal/execution.log
      - name: Retain floating atomic execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-float-metal-${{ github.run_attempt }}
          path: .mlx-float-metal
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  directx:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-directx
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"

    name: Translated DirectX indexed gather
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize DirectX execution evidence
        run: |
          mkdir -p .mlx-gather-directx
          python --version > .mlx-gather-directx/python-version.txt
      - name: Install CrossTL and runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist numpy \
            2>&1 | tee .mlx-gather-directx/dependencies.log
      - name: Install pinned DirectX tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Checkout pinned upstream MLX
        run: |
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
      - name: Validate indexed DirectX gather and resource aggregates
        env:
          CROSTL_REQUIRE_HALF_BUFFER_RUNTIME: "1"
          CROSTL_REQUIRE_BFLOAT_BUFFER_RUNTIME: "1"
          CROSTL_REQUIRE_BFLOAT_CONVERSION_RUNTIME: "1"
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_REQUIRE_MLX_DIRECTX_GENERAL_GATHER: "1"
          CROSTL_REQUIRE_RANGE_BINDINGS: "1"
          CROSTL_REQUIRE_UNION_STORAGE: "1"
          CROSTL_REQUIRE_NARROW_INTEGER_CONVERSIONS: "1"
          CROSTL_REQUIRE_VECTOR_LIST_INITIALIZATION: "1"
          CROSTL_REQUIRE_FLOAT_ATOMIC_MEMORY: "1"
          CROSTL_REQUIRE_FLOAT_ATOMIC_COMPARE_EXCHANGE: "1"
          CROSTL_REQUIRE_MLX_FLOAT_SCATTER: "1"
          CROSTL_REQUIRE_RESOURCE_AGGREGATES: "1"
          CROSTL_REQUIRE_VOID_RETURN_EFFECTS: "1"
          CROSTL_REQUIRE_TEMPLATE_WRAPPER_RUNTIME: "1"
