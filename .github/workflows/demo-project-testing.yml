          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-slice-update/adaptation.json
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX slice update host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-slice-update/build.log
      - name: Translate slice update kernels
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX slice update translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family slice-update --output-dir .mlx-portable-slice-update/slice-update-packages \
              2>&1 | tee .mlx-portable-slice-update/slice-update-translation.log
      - name: Execute slice update reductions
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3000 --label "MLX slice update verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_slice_updates --mlx-root mlx-upstream \
              --packages .mlx-portable-slice-update/base/base/packages --integer64 .mlx-portable-slice-update/base/integer64-packages \
              --slice-updates .mlx-portable-slice-update/slice-update-packages \
              --reductions .mlx-portable-slice-update/base/reductions --reductions .mlx-portable-slice-update/base/padding-reductions \
              --output-dir .mlx-portable-slice-update/slice-update-evidence \
