  native-metal-reference:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-native-metal-reference
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "4367c73b60541ddd5a266ce4644fd93d20223b6e"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    name: Pinned MLX native Metal reference
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout CrossTL
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install native baseline build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cmake ninja typing_extensions numpy ml_dtypes
          python --version
          cmake --version
          ninja --version
          xcodebuild -version
          xcrun --sdk macosx metal --version

      - name: Checkout pinned MLX Metal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-metal-source
          git init mlx-metal-source
          git -C mlx-metal-source remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-metal-source config advice.detachedHead false
          git -C mlx-metal-source sparse-checkout init --no-cone
          git -C mlx-metal-source sparse-checkout set /mlx/backend/metal/kernels/
          git -C mlx-metal-source fetch --depth=1 --filter=blob:none origin "$MLX_COMMIT"
          git -C mlx-metal-source checkout --detach FETCH_HEAD
          test "$(git -C mlx-metal-source rev-parse HEAD)" = "$MLX_COMMIT"
          test -z "$(git -C mlx-metal-source status --porcelain=v1 --untracked-files=all -- mlx/backend/metal/kernels)"

      - name: Checkout full pinned MLX test tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-upstream
          git init mlx-upstream
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream config advice.detachedHead false
          git -C mlx-upstream fetch --depth=1 --filter=blob:none origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          test "$(git -C mlx-upstream rev-parse HEAD)" = "$MLX_COMMIT"
          test -z "$(git -C mlx-upstream status --porcelain=v1 --untracked-files=all)"

      - name: Run native Metal reference baseline
        run: |
          python demos/integrations/mlx/run_native_metal.py \
            --mlx-root mlx-metal-source \
            --mlx-python-root mlx-upstream \
            --output-dir .crosstl-mlx-native-metal \
            --jobs 3

      - name: Upload native Metal evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-native-metal-evidence-${{ github.run_attempt }}
          path: |
            .crosstl-mlx-native-metal/evidence.json
            .crosstl-mlx-native-metal/logs
          if-no-files-found: error
          retention-days: 14

  directx-dispatch-sequence:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-directx-dispatch-sequence
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "4367c73b60541ddd5a266ce4644fd93d20223b6e"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    name: Direct3D ordered dispatch sequence
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout CrossTL
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DirectX Shader Compiler
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc"
          $dxcUri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip"
          $dxcSha256 = "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $dxcUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "DXC download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $archiveSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne $dxcSha256) {
            throw "DXC archive checksum mismatch: expected $dxcSha256, got $archiveSha256."
          }
          Expand-Archive -Path $archive -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem -Path $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match "\\bin\\x64\\dxc.exe$" } |
            Select-Object -First 1
          if ($null -eq $dxc) {
            throw "dxc.exe not found in release archive."
          }
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Direct3D runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[directx-runtime]" pytest-xdist

      - name: Checkout pinned MLX Metal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-upstream
          git init mlx-upstream
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream config advice.detachedHead false
          git -C mlx-upstream sparse-checkout init --cone
          git -C mlx-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-upstream fetch --depth=1 --filter=blob:none origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          test "$(git -C mlx-upstream rev-parse HEAD)" = "$MLX_COMMIT"
          test -z "$(git -C mlx-upstream status --porcelain=v1 --untracked-files=all)"

      - name: Prove Direct3D ordered dispatch sequence
        env:
          CROSTL_RUN_DIRECTX_DISPATCH_SEQUENCE_DEVICE_TEST: "1"
          CROSTL_MLX_SOURCE_ROOT: mlx-upstream
        run: >-
          dxc --version &&
          python -m pytest -q -n auto
          tests/test_translator/test_runtime_graph_device.py::test_directx_dispatch_sequence_executes_shared_temporary_on_device

  opengl-dispatch-sequence:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-opengl-dispatch-sequence
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "4367c73b60541ddd5a266ce4644fd93d20223b6e"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    name: OpenGL ordered dispatch sequence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout CrossTL
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenGL runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libopengl0
          python -m pip install --upgrade pip
          python -m pip install -e . moderngl==5.12.0 PyOpenGL==3.1.10 pytest-xdist
          glslangValidator --version

      - name: Checkout pinned MLX Metal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-upstream
          git init mlx-upstream
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream config advice.detachedHead false
          git -C mlx-upstream sparse-checkout init --cone
          git -C mlx-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-upstream fetch --depth=1 --filter=blob:none origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          test "$(git -C mlx-upstream rev-parse HEAD)" = "$MLX_COMMIT"
          test -z "$(git -C mlx-upstream status --porcelain=v1 --untracked-files=all)"

      - name: Prove OpenGL ordered dispatch sequence
        env:
          CROSTL_RUN_OPENGL_DISPATCH_SEQUENCE_DEVICE_TEST: "1"
          CROSTL_MLX_SOURCE_ROOT: mlx-upstream
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_runtime_graph_device.py::test_opengl_dispatch_sequence_executes_shared_temporary_on_device

  portable-host:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-portable-host-${{ strategy.job-index }}
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

    name: MLX native host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
          - os: windows-2025
            target: directx
          - os: macos-26
            target: metal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize execution evidence
        run: |
          mkdir -p .mlx-portable-host
          python --version > .mlx-portable-host/python-version.txt
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist "PyYAML>=6,<7" setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-host/dependencies.log
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-host/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-host/swift-version.txt
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m pip install moderngl PyOpenGL 2>&1 | tee -a .mlx-portable-host/dependencies.log
          python -c "import moderngl, OpenGL; print(moderngl.__version__, OpenGL.__version__)"
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Validate portable host contracts
        if: runner.os == 'Linux'
        run: python -m pytest -q -n auto demos/integrations/mlx/tests/host/test_portable_host.py demos/integrations/mlx/tests/host/test_portable_reductions.py demos/integrations/mlx/tests/host/test_portable_rows.py demos/integrations/mlx/tests/host/test_portable_reduction_shards.py demos/integrations/mlx/tests/host/test_portable_mixed_reductions.py demos/integrations/mlx/tests/host/test_portable_columns.py demos/integrations/mlx/tests/host/test_portable_small_rows.py demos/integrations/mlx/tests/host/test_portable_empty_reductions.py demos/integrations/mlx/tests/host/test_portable_bitwise.py demos/integrations/mlx/tests/host/test_portable_concatenate.py demos/integrations/mlx/tests/host/test_portable_selection.py demos/integrations/mlx/tests/host/test_portable_integer64.py demos/integrations/mlx/tests/host/test_portable_padding.py demos/integrations/mlx/tests/host/test_portable_slice_updates.py demos/integrations/mlx/tests/host/test_portable_slice_update_workloads.py demos/integrations/mlx/tests/host/test_slice_capacity.py demos/integrations/mlx/tests/test_random_audit.py demos/integrations/mlx/tests/host/test_portable_random.py demos/integrations/mlx/tests/host/test_cast_batches.py demos/integrations/mlx/tests/host/test_large_copies.py demos/integrations/mlx/tests/host/test_binary_batches.py demos/integrations/mlx/tests/host/test_unary_batches.py
      - name: Validate platform host ABI
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
