              tests/test_translator/test_native_loader_dispatch_integration.py::test_native_loader_descriptor_executes_directx_on_device \
              tests/test_translator/test_native_loader_dispatch_integration.py::test_native_loader_descriptor_executes_opengl_on_device \
              2>&1 | tee .mlx-portable-host/binary-math.log
      - name: Validate pinned real power
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_MLX_CURRENT_TARGET: ${{ matrix.target }}
          CROSTL_REQUIRE_MLX_CURRENT_REAL_POWER: "1"
          CROSTL_REQUIRE_METAL_POWER: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/real-power
          python tools/run_bounded_command.py --timeout-seconds 180 --label "Pinned real power" -- \
            python -m pytest -q -n auto \
              -m extended_power \
              --basetemp=.mlx-portable-host/real-power/pytest \
              --junitxml=.mlx-portable-host/real-power/results.xml \
              demos/integrations/mlx/tests/kernels/test_current_real_power.py::test_current_real_power_native_parity \
              tests/test_translator/test_metal_power.py \
              2>&1 | tee .mlx-portable-host/real-power.log
      - name: Execute pinned resident attention reductions
        env:
          CROSTL_REQUIRE_MLX_ATTENTION_REDUCE_RUNTIME: "1"
          CROSTL_MLX_ATTENTION_REDUCE_TARGET: ${{ matrix.target }}
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-upstream
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p .mlx-portable-host/attention-reduce
          python tools/run_bounded_command.py --timeout-seconds 300 --label "Resident attention reductions" -- \
            python -m pytest -q -n auto --dist loadscope \
              --basetemp=.mlx-portable-host/attention-reduce/pytest \
              --junitxml=.mlx-portable-host/attention-reduce/results.xml \
              demos/integrations/mlx/tests/kernels/test_attention_reduce_runtime.py \
              2>&1 | tee .mlx-portable-host/attention-reduce.log
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX portable host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-host/build.log
      - name: Translate unchanged upstream kernels
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 2400 --label "MLX host package translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --output-dir .mlx-portable-host/packages 2>&1 | tee .mlx-portable-host/translation.log
      - name: Execute upstream tests on the translated backend
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 4000 --label "MLX portable host verification" -- \
            python -m demos.integrations.mlx.portable_host.verify --mlx-root mlx-upstream \
              --packages .mlx-portable-host/packages --cast-batches --large-copies --binary-batches --unary-batches --output-dir .mlx-portable-host/evidence 2>&1 | tee .mlx-portable-host/verification.log
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-host-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-host
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  small-row-reductions:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-small-row-reductions-${{ strategy.job-index }}
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

    name: MLX small-row reductions (${{ matrix.target }})
    needs: portable-host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
          - os: windows-2025
            target: directx
          - os: macos-26
            target: metal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize small-row evidence
        run: mkdir -p .mlx-portable-small-rows
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-small-rows/dependencies.log
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: python -m pip install moderngl PyOpenGL
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-small-rows/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-small-rows/swift-version.txt
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Select same-run host packages
        uses: actions/github-script@v7
        id: host-artifact
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const prefix = `mlx-portable-host-${process.env.MLX_TARGET}-`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const candidates = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
              && /^\d+$/.test(item.name.slice(prefix.length)));
            candidates.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
            if (!candidates.length) throw new Error("The required host proof artifact is missing.");
            core.setOutput("id", candidates[0].id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.host-artifact.outputs.id }}
          path: .mlx-portable-small-rows/base
          merge-multiple: true
