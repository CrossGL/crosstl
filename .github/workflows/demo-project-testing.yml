        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-small-rows/adaptation.json
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX small-row host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-small-rows/build.log
      - name: Execute small-row host reductions
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 4000 --label "MLX small-row host verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_small_rows --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --jobs 2 --output-dir .mlx-portable-small-rows/evidence 2>&1 | tee .mlx-portable-small-rows/verification.log
      - name: Translate reduction initialization
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 900 --label "MLX initialization translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family init --jobs 4 --output-dir .mlx-portable-small-rows/init-packages \
              2>&1 | tee .mlx-portable-small-rows/init-translation.log
      - name: Execute empty host reductions
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1200 --label "MLX empty reduction verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_empty_reductions --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --reductions .mlx-portable-small-rows/init-packages \
              --output-dir .mlx-portable-small-rows/empty-evidence 2>&1 | tee .mlx-portable-small-rows/empty-verification.log
      - name: Translate bitwise host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX bitwise translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family bitwise --output-dir .mlx-portable-small-rows/bitwise-packages \
              2>&1 | tee .mlx-portable-small-rows/bitwise-translation.log
      - name: Execute bitwise host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1500 --label "MLX bitwise verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_bitwise --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --bitwise .mlx-portable-small-rows/bitwise-packages \
              --output-dir .mlx-portable-small-rows/bitwise-evidence 2>&1 | tee .mlx-portable-small-rows/bitwise-verification.log
      - name: Translate concatenation test reduction
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX concatenation reduction translation" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --entry all_reduce_andbool_ --width 32 \
              --output-dir .mlx-portable-small-rows/concatenate-reductions \
              2>&1 | tee .mlx-portable-small-rows/concatenate-translation.log
      - name: Execute concatenation host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1500 --label "MLX concatenation verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_concatenate --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --reductions .mlx-portable-small-rows/concatenate-reductions \
              --output-dir .mlx-portable-small-rows/concatenate-evidence 2>&1 | tee .mlx-portable-small-rows/concatenate-verification.log
      - name: Translate selection host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX selection translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family selection --output-dir .mlx-portable-small-rows/selection-packages \
              2>&1 | tee .mlx-portable-small-rows/selection-translation.log
      - name: Translate absolute-value host packages
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX absolute-value translation" -- \
            python -m demos.integrations.mlx.portable_host.packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --family absolute --output-dir .mlx-portable-small-rows/absolute-packages \
              2>&1 | tee .mlx-portable-small-rows/absolute-translation.log
      - name: Execute selection host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX selection verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_selection --mlx-root mlx-upstream \
              --packages .mlx-portable-small-rows/base/packages --selection .mlx-portable-small-rows/selection-packages \
              --absolute .mlx-portable-small-rows/absolute-packages --reductions .mlx-portable-small-rows/concatenate-reductions \
              --output-dir .mlx-portable-small-rows/selection-evidence 2>&1 | tee .mlx-portable-small-rows/selection-verification.log
      - name: Translate random kernels
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX random packages" -- \
            python -m demos.integrations.mlx.portable_host.random_packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --output-dir .mlx-portable-small-rows/random-packages \
              2>&1 | tee .mlx-portable-small-rows/random-translation.log
      - name: Translate random assertion reductions
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 600 --label "MLX random reduction packages" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --entry all_reduce_andbool_ --entry all_reduce_sumfloat32 \
              --width 32 --width 256 --jobs 2 --output-dir .mlx-portable-small-rows/random-reductions \
              2>&1 | tee .mlx-portable-small-rows/random-reductions.log
      - name: Execute random workloads and unchanged upstream tests
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
