      - name: Execute general gather host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3600 --label "MLX gather verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_gather --capacity --mlx-root mlx-upstream \
              --packages .mlx-portable-slice-update/base/base/packages --integer64 .mlx-portable-slice-update/base/integer64-packages \
              --reductions .mlx-portable-slice-update/base/reductions \
              --output-dir .mlx-portable-slice-update/gather-evidence \
              2>&1 | tee .mlx-portable-slice-update/gather-verification.log
      - name: Execute axis gather host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3600 --label "MLX axis gather verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_gather --axis --mlx-root mlx-upstream \
              --packages .mlx-portable-slice-update/base/base/packages --integer64 .mlx-portable-slice-update/base/integer64-packages \
              --reductions .mlx-portable-slice-update/base/reductions \
              --output-dir .mlx-portable-slice-update/gather-axis-evidence \
              2>&1 | tee .mlx-portable-slice-update/gather-axis-verification.log
      - name: Execute axis scatter host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3600 --label "MLX axis scatter verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_scatter_axis --mlx-root mlx-upstream \
              --packages .mlx-portable-slice-update/base/base/packages --integer64 .mlx-portable-slice-update/base/integer64-packages \
              --output-dir .mlx-portable-slice-update/scatter-axis-evidence \
              2>&1 | tee .mlx-portable-slice-update/scatter-axis-verification.log
      - name: Retain slice update execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-slice-update-${{ matrix.target }}-${{ github.run_attempt }}
          path: .mlx-portable-slice-update
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  scatter-host:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-scatter-host-${{ strategy.job-index }}
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

    name: MLX general scatter host (${{ matrix.target }}, ${{ matrix.profile }})
    needs: integer64-host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
            profile: integer
          - os: windows-2025
            target: directx
            profile: integer
          - os: macos-26
            target: metal
            profile: integer
          - os: windows-2025
            target: directx
            profile: float32
          - os: ubuntu-24.04
            target: opengl
            profile: float32
          - os: xcode-27
            target: metal
            profile: float32
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize general scatter evidence
        run: mkdir -p .mlx-portable-scatter
      - name: Select float scatter Metal toolchain
        if: runner.os == 'macOS' && matrix.profile == 'float32'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-scatter/dependencies.log
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: python -m pip install moderngl PyOpenGL
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-scatter/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-scatter/swift-version.txt
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Select same-run integer64 packages
        uses: actions/github-script@v7
        id: host-artifact
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const prefix = `mlx-portable-integer64-${process.env.MLX_TARGET}-`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const candidates = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
              && /^\d+$/.test(item.name.slice(prefix.length)));
            candidates.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
            if (!candidates.length) throw new Error("The required host proof artifact is missing.");
            core.setOutput("id", candidates[0].id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.host-artifact.outputs.id }}
          path: .mlx-portable-scatter/base
          merge-multiple: true
      - name: Prepare pinned MLX
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-scatter/adaptation.json
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX general scatter host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-scatter/build.log
      - name: Execute general scatter host operations
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYOPENGL_PLATFORM: egl
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 3600 --label "MLX general scatter verification" -- \
            python -m demos.integrations.mlx.portable_host.verify_scatter --mlx-root mlx-upstream \
              --packages .mlx-portable-scatter/base/base/packages --integer64 .mlx-portable-scatter/base/integer64-packages \
              ${{ matrix.profile == 'float32' && '--float32' || '' }} \
              --output-dir .mlx-portable-scatter/scatter-evidence \
              2>&1 | tee .mlx-portable-scatter/scatter-verification.log
      - name: Retain general scatter execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-portable-scatter-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_attempt }}
          path: .mlx-portable-scatter
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  row-packages:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-row-packages-${{ strategy.job-index }}
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

    name: MLX row translation (${{ matrix.target }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: [metal, opengl, directx]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize row translation evidence
        run: mkdir -p .mlx-row-shard
      - name: Install translation dependencies
        run: |
          set -euo pipefail
          python -m pip install -e . 2>&1 | tee .mlx-row-shard/dependencies.log
      - name: Check out pinned MLX kernels
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
      - name: Translate complete row shard
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 7200 --label "MLX row translation shard" -- \
            python -m demos.integrations.mlx.portable_host.reduction_shards build --mlx-root mlx-upstream \
              --target "${{ matrix.target }}" --shard "${{ matrix.shard }}" --jobs 2 \
              --output-dir .mlx-row-shard/packages 2>&1 | tee .mlx-row-shard/translation.log
      - name: Retain row translation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-row-packages-${{ matrix.target }}-s${{ matrix.shard }}-${{ github.run_attempt }}
          path: .mlx-row-shard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  reductions:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-reductions-${{ strategy.job-index }}
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_ARGS: "-DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=OFF -DMLX_CROSTL_HOST=ON -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON"

    name: MLX ${{ matrix.family }} reductions (${{ matrix.target }})
    needs: [portable-host, row-packages]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: opengl
            family: all
            verifier: verify
            companion_args: --upstream-quantization
          - os: windows-2025
            target: directx
            family: all
            verifier: verify
            companion_args: --upstream-quantization
          - os: macos-26
            target: metal
            family: all
            verifier: verify
            companion_args: --upstream-quantization
          - os: ubuntu-24.04
            target: opengl
            family: row
            verifier: verify_rows
            verification_timeout: 7800
            companion_args: --all-reductions .mlx-portable-reductions/companions --require-all-widths
          - os: windows-2025
            target: directx
            family: row
            verifier: verify_rows
            verification_timeout: 7800
            companion_args: --all-reductions .mlx-portable-reductions/companions --require-all-widths
          - os: macos-26
            target: metal
            family: row
            verifier: verify_rows
            verification_timeout: 7800
            companion_args: --all-reductions .mlx-portable-reductions/companions --require-all-widths
          - os: windows-2025
            target: directx
            family: column
            verifier: verify_columns
          - os: ubuntu-24.04
            target: opengl
            family: column
            verifier: verify_columns
          - os: macos-26
            target: metal
            family: column
            verifier: verify_columns
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize reduction evidence
        run: mkdir -p .mlx-portable-reductions
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev liblapacke-dev libegl1 libgl1-mesa-dri libglx-mesa0 libopengl0 glslang-tools
      - name: Install CrossTL and MLX build dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[directx-runtime]" pytest pytest-xdist setuptools wheel cmake ninja nanobind numpy packaging \
            2>&1 | tee .mlx-portable-reductions/dependencies.log
      - name: Install OpenGL runtime dependencies
        if: runner.os == 'Linux'
        run: python -m pip install moderngl PyOpenGL
      - name: Verify macOS Metal toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-portable-reductions/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-portable-reductions/swift-version.txt
      - name: Install pinned DirectX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4") {
            throw "DXC archive checksum mismatch."
          }
          Expand-Archive $archive -DestinationPath $root
          $bin = Join-Path $root "bin/x64"
          if (-not (Test-Path "$bin/dxc.exe")) { throw "DXC executable missing." }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $warpArchive = Join-Path $env:RUNNER_TEMP "warp.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "warp"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg" -OutFile $warpArchive
          if ((Get-FileHash $warpArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681") {
            throw "WARP archive checksum mismatch."
          }
          Expand-Archive $warpArchive -DestinationPath $warpRoot
          Copy-Item "$warpRoot/build/native/bin/x64/d3d10warp.dll" "$env:pythonLocation/d3d10warp.dll"
      - name: Select same-run host packages
        uses: actions/github-script@v7
        id: host-artifact
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const prefix = `mlx-portable-host-${process.env.MLX_TARGET}-`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const candidates = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
              && /^\d+$/.test(item.name.slice(prefix.length)));
            candidates.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
            if (!candidates.length) throw new Error("The required host proof artifact is missing.");
            core.setOutput("id", candidates[0].id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.host-artifact.outputs.id }}
          path: .mlx-portable-reductions/base
          merge-multiple: true
      - name: Prepare pinned MLX
        run: |
          set -euo pipefail
          git init mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream remote add origin https://github.com/ml-explore/mlx.git
          git -C mlx-upstream fetch --depth=1 origin "$MLX_COMMIT"
          git -C mlx-upstream checkout --detach FETCH_HEAD
          python -m demos.integrations.mlx.portable_host.prepare --mlx-root mlx-upstream --output .mlx-portable-reductions/adaptation.json
      - name: Build adapted upstream MLX
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 1800 --label "MLX reduction host build" -- \
            python -m pip install -e ./mlx-upstream --no-build-isolation -v 2>&1 | tee .mlx-portable-reductions/build.log
      - name: Translate reduction launch variants
        if: matrix.family != 'row'
        run: |
          set -euo pipefail
          python tools/run_bounded_command.py --timeout-seconds 12000 --label "MLX reduction packages" -- \
            python -m demos.integrations.mlx.portable_host.reduction_packages --mlx-root mlx-upstream \
              --target ${{ matrix.target }} --family ${{ matrix.family }} --jobs 2 --output-dir .mlx-portable-reductions/packages 2>&1 | tee .mlx-portable-reductions/translation.log
      - name: Select same-run row shards
        if: matrix.family == 'row'
        uses: actions/github-script@v7
        id: row-artifacts
        env:
          MLX_TARGET: ${{ matrix.target }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const ids = [];
            for (let shard = 0; shard < 8; shard++) {
              const prefix = `mlx-row-packages-${process.env.MLX_TARGET}-s${shard}-`;
              const matches = artifacts.filter(item => !item.expired && item.name.startsWith(prefix)
                && /^\d+$/.test(item.name.slice(prefix.length)));
              matches.sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
              if (!matches.length) throw new Error(`Missing row translation shard ${shard}`);
              ids.push(matches[0].id);
            }
            core.setOutput("ids", ids.join(","));
      - name: Download row shards
        if: matrix.family == 'row'
        uses: actions/download-artifact@v4
