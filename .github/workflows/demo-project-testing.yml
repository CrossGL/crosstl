  metal-host:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-metal-host
      cancel-in-progress: false
    if: github.event_name != 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MLX_COMMIT: "9c3d35571ac450a8ecf5c17b4d0e3fac52c08bc8"
      PYTHONUNBUFFERED: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    name: MLX translated Metal host execution
    runs-on: macos-26
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CrossTL and test dependencies
        run: python -m pip install -e . pytest pytest-xdist numpy "PyYAML>=6,<7"
      - name: Prepare Metal host toolchain
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p .mlx-metal-host/toolchain
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version | tee .mlx-metal-host/toolchain/metal-version.txt
          xcrun --sdk macosx swiftc --version | tee .mlx-metal-host/toolchain/swift-version.txt
          xcrun --sdk macosx metal -std=metal3.1 -Werror -c \
            tests/fixtures/runtime_verification/vector_add.metal \
            -o .mlx-metal-host/toolchain/probe.air
          test -s .mlx-metal-host/toolchain/probe.air
          xcrun --sdk macosx metallib .mlx-metal-host/toolchain/probe.air \
            -o .mlx-metal-host/toolchain/probe.metallib
          test -s .mlx-metal-host/toolchain/probe.metallib
