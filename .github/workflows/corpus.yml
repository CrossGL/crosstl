name: Corpus

# Third-party corpus tier (tests/conformance/corpus). Rebuilds the corpus from the projects and commits pinned in
# its manifest, translates every unit to each target this runner checks natively, and compares every cell and the
# p95 translation latency per source language with the committed scoreboard and budgets.json. A cell that gets
# worse or cannot be checked, or a latency budget that is exceeded, fails the job. The tier is heavy, so it runs
# nightly, on demand, and on a pull request only while it carries the "corpus" label; the runner's unit tests run
# with the conformance tier on every pull request that touches it.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "0"

on:
  schedule:
    - cron: "41 3 * * *"
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      slices:
        description: Comma-separated corpus slices (empty runs every slice)
        default: ""

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus:
    name: Corpus (${{ matrix.name }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'corpus')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux HLSL, GLSL, GLSL ES and SPIR-V
            os: ubuntu-24.04
            targets: hlsl,glsl,essl,spirv
          - name: macOS Metal
            os: xcode-27
            targets: metal
            developer_dir: /Applications/Xcode_27.1.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      CROSSTL_CONFORMANCE_CACHE: ${{ github.workspace }}/../conformance-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Select the scoreboard profile
        run: |
          set -euo pipefail
          profile="$(python -c "import platform; print(f'ci-{platform.system()}-{platform.machine()}'.lower())")"
          {
            echo "CROSSTL_CONFORMANCE_PROFILE=$profile"
            echo "CORPUS_OUT=$RUNNER_TEMP/corpus"
            echo "CORPUS_SCOREBOARD=tests/conformance/corpus/scoreboards/$profile.json"
          } >> "$GITHUB_ENV"

      - name: Install pinned Linux DXC
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-dxc
        with:
          pinned: "true"

      - name: Install pinned glslang and SPIRV-Tools
        uses: ./.github/actions/install-shader-validators

      - name: Prepare the Metal toolchain
        if: runner.os == 'macOS'
        run: python tools/ensure_metal_toolchain.py

      - name: Install CrossTL
        run: python -m pip install -e .

      - name: Record toolchains
        run: python -m tests.conformance.toolchains --markdown | tee "$RUNNER_TEMP/toolchains.md"

      - name: Corpus against the scoreboard and latency budgets
        env:
          TARGETS: ${{ matrix.targets }}
          SLICES: ${{ github.event.inputs.slices }}
        run: >-
          python -m tests.conformance.corpus.run --output "$CORPUS_OUT" --targets "$TARGETS"
          ${SLICES:+--slices "$SLICES"} --workers "$(python -c 'import os; print(os.cpu_count() or 2)')"
          --scoreboard "$CORPUS_SCOREBOARD"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ env.CROSSTL_CONFORMANCE_PROFILE }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.CORPUS_OUT }}/results.jsonl
            ${{ env.CORPUS_OUT }}/summary.json
            ${{ env.CORPUS_OUT }}/${{ env.CROSSTL_CONFORMANCE_PROFILE }}.json
            ${{ runner.temp }}/toolchains.md
