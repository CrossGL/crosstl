  mlx-unary-complete-directx-translation:
    name: MLX complete unary DirectX translation (shard ${{ matrix.shard_index }} of 5)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout CrossTL
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest-xdist

      - name: Install pinned Windows DirectX Shader Compiler
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc"
          $dxcUri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip"
          $dxcSha256 = "cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $dxcUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "DXC download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $archiveSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne $dxcSha256) {
            throw "DXC archive checksum mismatch: expected $dxcSha256, got $archiveSha256."
          }
          Expand-Archive -Path $archive -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem -Path $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match "\\bin\\x64\\dxc.exe$" } |
            Select-Object -First 1
          if ($null -eq $dxc) {
            throw "dxc.exe not found in release archive."
          }
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $dxc.FullName --version

      - name: Checkout current MLX unary corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ml-explore/mlx.git mlx-current-upstream
          git -C mlx-current-upstream config core.autocrlf false
          git -C mlx-current-upstream sparse-checkout init --cone
          git -C mlx-current-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-current-upstream checkout --detach "$MLX_CORPUS_COMMIT"
          test "$(git -C mlx-current-upstream rev-parse HEAD)" = "$MLX_CORPUS_COMMIT"

      - name: Prove current MLX complete unary family DirectX translation
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_UNARY_DIRECTX_TRANSLATION: "1"
          CROSTL_MLX_UNARY_DIRECTX_SHARD_INDEX: ${{ matrix.shard_index }}
          CROSTL_MLX_UNARY_DIRECTX_SHARD_COUNT: "5"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_unary_complete_directx.py::test_current_mlx_unary_family_translates_to_directx

