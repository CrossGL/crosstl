permissions:
  contents: read

jobs:
  mlx-metal-porting:
    name: MLX Metal project porting (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout CrossTL
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest-xdist

      - name: Install macOS Metal Toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version

      - name: Validate bounded MLX dispatch contracts
        run: python -m pytest -q -n auto tests/test_mlx_dispatch_contract_fixture.py tests/test_mlx_logsumexp_dispatch_contract_fixture.py

      - name: Install Linux SPIR-V tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libopengl0 mesa-vulkan-drivers spirv-tools vulkan-tools
          glslangValidator --version

      - name: Install Linux DXC
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-dxc

      - name: Validate OpenGL lowering contracts
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest
          python -m pytest -q -n auto tests/test_translator/test_codegen/test_GLSL_codegen.py \
            -k "opengl_lowers_expected_scalar_and_vector_conversions or opengl_broadcasts_scalar_literals_to_vector_assignments or opengl_preserves_metal_arithmetic_conversion_order or opengl_helper_parameters_preserve_out_and_inout_qualifiers or glsl_atomic_thread_fence"
          python -m pytest -q -n auto tests/test_translator/test_project_translation.py \
            -k "translate_project_reports_unrepresentable_atomic_fence_contract"

      - name: Install Windows DirectX Shader Compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc"
          $dxcUri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $dxcUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "DXC download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          Expand-Archive -Path $archive -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem -Path $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match "\\bin\\x64\\dxc.exe$" } |
            Select-Object -First 1
          if ($null -eq $dxc) {
            throw "dxc.exe not found in release archive."
          }
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Windows Direct3D runtime dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[directx-runtime]" pytest-xdist

      - name: Install pinned Windows WARP runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $warpVersion = "1.0.20"
          $warpSha256 = "e5fe5de661ce98b58ef9cfb736e73c0a7a2623d3bbf5f14839b2d55566d87e40"
          $archive = Join-Path $env:RUNNER_TEMP "microsoft.direct3d.warp.$warpVersion.zip"
          $warpRoot = Join-Path $env:RUNNER_TEMP "microsoft.direct3d.warp.$warpVersion"
          $warpUri = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/$warpVersion/microsoft.direct3d.warp.$warpVersion.nupkg"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $warpUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "WARP download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $archiveSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne $warpSha256) {
            throw "WARP archive checksum mismatch: expected $warpSha256, got $archiveSha256."
          }
          Expand-Archive -Path $archive -DestinationPath $warpRoot -Force
          $warp = Join-Path $warpRoot "build\native\bin\x64\d3d10warp.dll"
          if (-not (Test-Path -Path $warp -PathType Leaf)) {
            throw "d3d10warp.dll not found in WARP package."
          }
          $pythonWarp = Join-Path $env:pythonLocation "d3d10warp.dll"
          Copy-Item -Path $warp -Destination $pythonWarp -Force
          Write-Host "Installed WARP $((Get-Item $pythonWarp).VersionInfo.FileVersion) beside python.exe."

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install moderngl==5.12.0 PyOpenGL==3.1.10 pytest-xdist vulkan==1.3.275.1

      - name: Checkout pinned MLX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-upstream
          git clone --filter=blob:none --no-checkout https://github.com/ml-explore/mlx.git mlx-upstream
          git -C mlx-upstream config core.autocrlf false
          git -C mlx-upstream sparse-checkout init --cone
          git -C mlx-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-upstream checkout "$MLX_COMMIT"

      - name: Checkout current MLX runtime proof corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mlx-current-upstream
          git clone --filter=blob:none --no-checkout https://github.com/ml-explore/mlx.git mlx-current-upstream
          git -C mlx-current-upstream config core.autocrlf false
          git -C mlx-current-upstream sparse-checkout init --cone
          git -C mlx-current-upstream sparse-checkout set mlx/backend/metal/kernels
          git -C mlx-current-upstream checkout --detach "$MLX_CORPUS_COMMIT"
          test "$(git -C mlx-current-upstream rev-parse HEAD)" = "$MLX_CORPUS_COMMIT"

      - name: Translate pinned MLX unary Square entry
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_unary_native_loader.py::test_pinned_mlx_unary_square_translates_to_selected_target

      - name: Translate pinned MLX unary ArcCos entry
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_unary_native_loader.py::test_pinned_mlx_unary_arccos_translates_to_selected_target

      - name: Prove pinned MLX LogSumExp Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_LOGSUMEXP_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_logsumexp_native_loader.py::test_pinned_mlx_logsumexp_executes_through_directx_native_loader

      - name: Prove pinned MLX Softmax Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_SOFTMAX_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_softmax_native_loader.py::test_pinned_mlx_softmax_executes_through_directx_native_loader

      - name: Prove pinned MLX arg-reduce Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_ARG_REDUCE_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_arg_reduce_native_loader.py::test_pinned_mlx_arg_reduce_executes_through_directx_native_loader

      - name: Prove pinned MLX scaled-attention Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_ATTENTION_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_scaled_dot_product_attention_native_loader.py::test_pinned_mlx_attention_executes_through_directx_native_loader

      - name: Validate Direct3D software subgroup shuffle execution
        if: runner.os == 'Windows'
        env:
          CROSTL_RUN_DIRECTX_SOFTWARE_SUBGROUP_DEVICE_TEST: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_native_runtime_drivers.py::test_directx_compute_runtime_executes_software_subgroup_shuffle_on_device

      - name: Prove current MLX GEMV Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_GEMV_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_gemv_native_loader.py::test_current_mlx_gemv_executes_through_directx_native_loader

      - name: Prove current MLX MXFP4 Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_MXFP4_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_fp_quantized_native_loader.py::test_current_mlx_mxfp4_executes_through_directx_native_loader

      - name: Prove pinned MLX RMSNorm Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_RMS_NORM_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_rms_norm_native_loader.py::test_pinned_mlx_rms_norm_executes_through_directx_native_loader

      - name: Prove pinned MLX RMSNorm VJP Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_RMS_NORM_VJP_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_rms_norm_vjp_native_loader.py::test_pinned_mlx_rms_norm_vjp_executes_through_directx_native_loader

      - name: Prove pinned MLX LayerNorm Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_LAYER_NORM_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_layer_norm_native_loader.py::test_pinned_mlx_layer_norm_executes_through_directx_native_loader

      - name: Prove pinned MLX LayerNorm VJP Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_LAYER_NORM_VJP_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_layer_norm_vjp_native_loader.py::test_pinned_mlx_layer_norm_vjp_executes_through_directx_native_loader

      - name: Prove pinned MLX dot Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_DOT_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_dot_native_loader.py::test_pinned_mlx_dot_executes_through_directx_native_loader

      - name: Prove pinned MLX unary Square Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_UNARY_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_unary_native_loader.py::test_pinned_mlx_unary_square_executes_through_directx_native_loader

      - name: Prove pinned MLX unary ArcCos Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_UNARY_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_unary_native_loader.py::test_pinned_mlx_unary_arccos_executes_through_directx_native_loader

      - name: Prove pinned MLX unary Square Metal round-trip
        if: runner.os == 'macOS'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_UNARY_METAL_ROUNDTRIP: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_unary_native_loader.py::test_pinned_mlx_unary_square_roundtrips_through_metal

      - name: Prove pinned MLX unary ArcCos Metal round-trip
        if: runner.os == 'macOS'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_UNARY_METAL_ROUNDTRIP: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_unary_native_loader.py::test_pinned_mlx_unary_arccos_roundtrips_through_metal

      - name: Record pinned MLX dot Metal round-trip boundary
        if: runner.os == 'macOS'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-current-upstream
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_dot_native_loader.py::test_pinned_mlx_dot_records_metal_roundtrip_boundary

      - name: Prove pinned MLX FFT Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_ROOT: ${{ github.workspace }}/mlx-upstream
          CROSTL_REQUIRE_MLX_FFT_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_fft_native_loader.py::test_pinned_mlx_fft_executes_through_directx_native_loader

      - name: Prove current MLX FFT Direct3D native-loader execution
        if: runner.os == 'Windows'
        env:
          CROSTL_MLX_CURRENT_ROOT: ${{ github.workspace }}/mlx-current-upstream
          CROSTL_REQUIRE_MLX_FFT_DIRECTX_NATIVE_LOADER: "1"
        run: >-
          python -m pytest -q -n auto
          tests/test_translator/test_mlx_fft_native_loader.py::test_current_mlx_fft_executes_through_directx_native_loader

      - name: Enumerate pinned MLX Metal entry points
        shell: bash
        run: |
          set -euo pipefail
          python demos/integrations/mlx/discover_entries.py \
            --mlx-root mlx-upstream \
            --expected-commit "$MLX_COMMIT" \
            --expected-unit-count 40 \
            --expected-entry-count 16446

      - name: Run MLX project-porting checks
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            vulkaninfo --summary || true
            python demos/integrations/mlx/run_mlx_porting.py \
