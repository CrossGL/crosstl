name: Backend Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-versions:
    name: Select Python versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.select.outputs.versions }}
    steps:
      - name: Select Python versions
        id: select
        env:
          # Pushes to main and pull requests labelled ci:full test every supported
          # version; other pull requests test the oldest and the newest.
          FULL_PYTHON_VERSIONS: '["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]'
          PULL_REQUEST_PYTHON_VERSIONS: '["3.8", "3.13"]'
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "versions=$FULL_PYTHON_VERSIONS" >> "$GITHUB_OUTPUT"
          else
            echo "versions=$PULL_REQUEST_PYTHON_VERSIONS" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: python-versions
    runs-on: ${{ matrix.OS }}
    timeout-minutes: 45
    env:
      # Public-repository runners have 4 vCPUs on Linux and Windows and 3 on macOS.
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ matrix.OS == 'macOS-latest' && '3' || '4' }}
    strategy:
      matrix:
        backend:
          [
            directx,
            metal,
            GLSL,
            "slang",
            "SPIRV",
            "mojo",
            "rust",
            "CUDA",
            "HIP",
          ]
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
        OS: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - OS: windows-latest
          - OS: macOS-latest
        include:
          - backend: all
            python-version: "3.13"
            OS: windows-latest
          - backend: all
            python-version: "3.13"
            OS: macOS-latest

      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        continue-on-error: true
        with:
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            setup.cfg
          python-version: ${{ matrix.python-version }}

      - name: Classify Python setup failure
        if: steps.setup_python.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=Python setup failed::actions/setup-python failed before project dependencies or tests ran (workflow=Backend Tests, backend=${{ matrix.backend }}, python=${{ matrix.python-version }}, os=${{ matrix.OS }}). Treat this as CI setup infrastructure unless a later dependency or pytest step executed."
          {
            echo "## Matrix Setup Failure"
            echo "- Workflow: Backend Tests"
            echo "- Backend: ${{ matrix.backend }}"
            echo "- Python: ${{ matrix.python-version }}"
            echo "- OS: ${{ matrix.OS }}"
            echo "- Stage: actions/setup-python"
            echo "- Classification: setup infrastructure before project tests"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt pytest-xdist

      - name: Run backend tests
        id: run_backend_tests
        shell: bash
        run: |
          mkdir -p support/generated
          if [ "${{ matrix.backend }}" == "all" ]; then
            python -m pytest tests/test_backend -n auto \
              --junitxml support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
          else
            python -m pytest tests/test_backend/test_${{ matrix.backend }} -n auto \
              --junitxml support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
          fi

      - name: Write backend test failure summary
        if: failure() && steps.run_backend_tests.outcome == 'failure'
        shell: bash
        run: |
          python tools/pytest_failure_summary.py \
            support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml \
            --json-output support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.json \
            --markdown-output support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.md
          cat support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend test failure summary
        if: failure() && steps.run_backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-tests-failure-summary-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}
          path: |
            support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
            support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.json
            support/generated/backend-tests-${{ matrix.backend }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.md
          if-no-files-found: ignore
          retention-days: 30

  result:
    # The one check per workflow that branch protection and the merge queue require.
    name: Backend Tests result
    if: always()
    needs: [python-versions, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
