name: Orphaned Merge-Group Runs

# Cancels the merge-group runs that can no longer change what the queue does (tools/orphaned_runs.py). When an
# entry fails or leaves the merge queue, GitHub replaces the groups behind it but lets the runs of the old groups
# finish; the runs of a group that landed are kept. A run that already has a failed job will fail its required
# result check, but that check reports only after the run's slowest leg, and the queue waits for it.
#
# Replacing groups creates new ones, so a sweep starts on every merge_group event and repeats every five minutes
# while the queue has groups. Runs triggered meanwhile share one concurrency group: the newest waits for the
# running sweep and the others are dropped. The schedule is a backstop only, since GitHub starts scheduled runs on
# this repository hours late. Pull requests that change the tool list what it would cancel.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  merge_group:
  schedule:
    - cron: '7,27,47 * * * *'
  pull_request:
    paths:
      - .github/workflows/orphaned-runs.yml
      - tools/orphaned_runs.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orphaned-runs-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list:
    name: List orphaned runs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: List the runs that would be cancelled
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.orphaned_runs --repo "$GITHUB_REPOSITORY"

  cancel:
    name: Cancel orphaned runs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cancel discarded and failed merge-group runs while the queue has groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.orphaned_runs --repo "$GITHUB_REPOSITORY" --apply --watch 300
