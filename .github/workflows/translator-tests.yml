name: Translator Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-versions:
    name: Select Python versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.select.outputs.versions }}
    steps:
      - name: Select Python versions
        id: select
        env:
          # Pushes to main and pull requests labelled ci:full test every supported
          # version; other pull requests test the oldest and the newest.
          FULL_PYTHON_VERSIONS: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
          PULL_REQUEST_PYTHON_VERSIONS: '["3.11", "3.15"]'
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "versions=$FULL_PYTHON_VERSIONS" >> "$GITHUB_OUTPUT"
          else
            echo "versions=$PULL_REQUEST_PYTHON_VERSIONS" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: python-versions
    runs-on: ${{ matrix.OS == 'macOS-latest' && 'xcode-27' || matrix.OS }}
    timeout-minutes: 45
    env:
      # Public-repository runners have 4 vCPUs on Linux and Windows and 3 on macOS.
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ matrix.OS == 'macOS-latest' && '3' || '4' }}
    strategy:
      matrix:
        component:
          [
            "directx",
            "metal",
            "GLSL",
            "slang",
            "SPIRV",
            "mojo",
            "rust",
            "CUDA",
            "hip",
            "webgl",
            "wgsl",
            "general-1-of-3",
            "general-2-of-3",
            "general-3-of-3",
          ]
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
        OS: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - OS: windows-latest
          - OS: macOS-latest
        # A K-of-N leg runs shard K of N (tools/pytest_shard.py). The general
        # tests took 13 to 24 minutes on one runner, every translator test 28
        # minutes on Windows and 15 on macOS, the longest required job in the
        # merge queue, which builds one group at a time.
        include:
          - component: all-1-of-3
            python-version: "3.13"
            OS: windows-latest
          - component: all-2-of-3
            python-version: "3.13"
            OS: windows-latest
          - component: all-3-of-3
            python-version: "3.13"
            OS: windows-latest
          - component: all-1-of-2
            python-version: "3.13"
            OS: macOS-latest
          - component: all-2-of-2
            python-version: "3.13"
            OS: macOS-latest

      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        continue-on-error: true
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Classify Python setup failure
        if: steps.setup_python.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=Python setup failed::actions/setup-python failed before project dependencies or tests ran (workflow=Translator Tests, component=${{ matrix.component }}, python=${{ matrix.python-version }}, os=${{ matrix.OS }}). Treat this as CI setup infrastructure unless a later dependency or pytest step executed."
          {
            echo "## Matrix Setup Failure"
            echo "- Workflow: Translator Tests"
            echo "- Component: ${{ matrix.component }}"
            echo "- Python: ${{ matrix.python-version }}"
            echo "- OS: ${{ matrix.OS }}"
            echo "- Stage: actions/setup-python"
            echo "- Classification: setup infrastructure before project tests"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify Metal 4.1 toolchain
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer
          diagnose_metal_failure() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Metal toolchain failure diagnostics"
              xcodebuild -showComponent MetalToolchain -json || true
              xcrun --sdk macosx --find metal || true
              mount || true
              echo "::endgroup::"
            fi
            exit "$status"
          }
          trap diagnose_metal_failure EXIT
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          python tools/ensure_metal_toolchain.py
          xcrun --sdk macosx metal -std=metal4.1 -x metal -fsyntax-only /dev/null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Rewrite test modules
        # Otherwise each xdist worker rewrites the asserts of every test module itself.
        # The other legs run one module, which the workers rewrite in parallel anyway.
        if: startsWith(matrix.component, 'all') || startsWith(matrix.component, 'general')
        shell: bash
        run: |
          component="${{ matrix.component }}"
          if [[ "$component" == general* ]]; then
            python -m tools.pytest_warm tests/test_translator --ignore=tests/test_translator/test_codegen
          else
            python -m tools.pytest_warm tests/test_translator
          fi

      - name: Run translator tests
        id: run_translator_tests
        shell: bash
        run: |
          mkdir -p build/reports
          component="${{ matrix.component }}"
          shard=()
          if [[ "$component" == *-of-* ]]; then
            part="${component#*-}"
            shard=(-p tools.pytest_shard --shard "${part%-of-*}/${part#*-of-}")
          fi
          if [[ "$component" == all* ]]; then
            python -m pytest tests/test_translator "${shard[@]}" -n auto \
              --junitxml build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
          elif [[ "$component" == general* ]]; then
            python -m pytest tests/test_translator --ignore=tests/test_translator/test_codegen "${shard[@]}" -n auto \
              --junitxml build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
          elif [ "${{ matrix.component }}" == "GLSL" ]; then
            python -m pytest tests/test_translator/test_codegen/test_${{ matrix.component }}_codegen.py -n auto \
              tests/test_translator/test_codegen/test_GLSL_workgroup_pointer_codegen.py \
              --junitxml build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
          else
            python -m pytest tests/test_translator/test_codegen/test_${{ matrix.component }}_codegen.py -n auto \
              --junitxml build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
          fi

      - name: Write translator test failure summary
        if: failure() && steps.run_translator_tests.outcome == 'failure'
        shell: bash
        run: |
          python tools/pytest_failure_summary.py \
            build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml \
            --json-output build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.json \
            --markdown-output build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.md
          cat build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload translator test failure summary
        if: failure() && steps.run_translator_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: translator-tests-failure-summary-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}
          path: |
            build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}.xml
            build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.json
            build/reports/translator-tests-${{ matrix.component }}-${{ matrix.python-version }}-${{ matrix.OS }}-failure-summary.md
          if-no-files-found: ignore
          retention-days: 30

  result:
    # The one check per workflow that branch protection and the merge queue require.
    name: Translator Tests result
    if: always()
    needs: [python-versions, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
