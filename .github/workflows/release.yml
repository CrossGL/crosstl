name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
    paths:
      - "crosstl/**"
      - "examples/**"
      - "support/**"
      - "docs/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "CITATION.cff"
      - ".zenodo.json"
      - "CHANGELOG.md"
      - "tools/check_release.py"
      - "tests/test_release.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        id: python-minimum
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.8"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify tag belongs to main and matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          comparison_status="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" \
              --jq .status
          )"
          case "$comparison_status" in
            identical|ahead) ;;
            *)
              printf 'Tag commit is not contained in main (status: %s).\n' "$comparison_status" >&2
              exit 1
              ;;
          esac

          package_version="$(python tools/check_release.py version)"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Verify required main CI succeeded
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          required_workflows=(
            full-tests.yml
            backend-tests.yml
            translator-tests.yml
            docs.yml
            examples-test.yml
            native-host-loader.yml
            deferred-native-compilation.yml
            demo-project-testing.yml
          )

          for workflow in "${required_workflows[@]}"; do
            run="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --commit "$GITHUB_SHA" \
                --branch main \
                --event push \
                --limit 1 \
                --json conclusion,status,url \
                --jq 'if length == 0 then "" else .[0] | [.status, .conclusion, .url] | @tsv end'
            )"
            if [[ -z "$run" ]]; then
              printf 'No main push run found for %s at %s.\n' "$workflow" "$GITHUB_SHA" >&2
              exit 1
            fi

            IFS=$'\t' read -r status conclusion url <<< "$run"
            if [[ "$status" != completed || "$conclusion" != success ]]; then
              printf '%s has not succeeded for %s: status=%s conclusion=%s %s\n' \
                "$workflow" "$GITHUB_SHA" "$status" "$conclusion" "$url" >&2
              exit 1
            fi
          done

      - name: Install release tooling
        run: python -m pip install build==1.2.2.post1 twine==7.0.0

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify release metadata and package contents
        run: python tools/check_release.py distributions dist

      - name: Test isolated wheel and source installations
        shell: bash
        run: |
          version="$(python tools/check_release.py version)"
          index=0
          for interpreter in "${{ steps.python-minimum.outputs.python-path }}" "$(command -v python)"; do
            index=$((index + 1))
            for package in dist/*.whl dist/*.tar.gz; do
              environment="$RUNNER_TEMP/install-$index-$(basename "$package")"
              "$interpreter" -m venv "$environment"
              "$environment/bin/python" -m pip install "$GITHUB_WORKSPACE/$package"
              (
                cd "$RUNNER_TEMP"
                env -u PYTHONPATH "$environment/bin/python" \
                  "$GITHUB_WORKSPACE/tools/check_release.py" installed --version "$version"
              )
            done
          done

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/

      - name: Publish distributions with repository token
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          attestations: false

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/

      - name: Verify published PyPI archive identities
        run: python tools/check_release.py published dist

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^---$/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create or update GitHub Release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="CrossTL ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --verify-tag \
              --title "$title" \
              --notes-file release-notes.md
          fi
