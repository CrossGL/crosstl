name: Documentation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      # coverage_pages writes one page per language from the report the Coverage workflow publishes.
      - name: Check out the published coverage report
        uses: actions/checkout@v7
        with:
          ref: coverage
          path: published-coverage
          persist-credentials: false

      - name: Build Sphinx HTML
        env:
          CROSSTL_COVERAGE: ${{ github.workspace }}/published-coverage
          CROSSTL_COVERAGE_REQUIRED: "1"
        run: make -C docs html
