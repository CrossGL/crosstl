name: Lint

# This workflow runs the pinned hooks in .pre-commit-config.yaml on the files a pull request or merge-queue entry
# changes, so a change that a hook would rewrite cannot reach main. pre-commit.ci runs the same hooks on every file of
# a pull request and pushes their fixes to it, so a file on main that a hook rewrites would reach every open pull
# request as an extra commit. The local hooks run test files the test workflows already run, so this job skips them.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: Pinned hooks on changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the pinned hooks
        env:
          SKIP: crosstl-ci-workflow-tests,crosstl-pytest-failure-summary-tests,crosstl-examples-script-tests
        run: |
          set -euo pipefail
          # Both the pull-request merge commit and a merge-queue commit have the base as their first parent.
          git diff --name-only --diff-filter=d -z HEAD^1 HEAD > changed
          if [ ! -s changed ]; then
            echo "No files changed."
            exit 0
          fi
          python -m pip install pre-commit==4.7.0
          # A change to the hooks or their pins can make any file fail them, so it runs them on every file.
          if grep -qzx '\.pre-commit-config\.yaml' changed; then
            pre-commit run --all-files --show-diff-on-failure --color=always
          else
            xargs -0 pre-commit run --show-diff-on-failure --color=always --files < changed
          fi

  result:
    name: Lint result
    needs: [hooks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check lint jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A lint job ended with $result."; exit 1 ;;
            esac
          done
