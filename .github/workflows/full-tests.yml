name: Complete Test Suite

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  POWERSHELL_TELEMETRY_OPTOUT: "1"
  POWERSHELL_UPDATECHECK: "Off"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # tools/pytest_shard.py splits the suite by test id. Six shards ran their tests
    # for about 10 minutes each, the longest job of a merge-queue run once macOS
    # translator tests were split; eight bring a shard under the translator legs.
    # Each shard still collects the whole suite.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Rewrite test modules
        # Otherwise each xdist worker rewrites the asserts of all 800 test modules itself.
        run: python -m tools.pytest_warm tests demos/integrations

      - name: Start PowerShell once
        # The first pwsh start on a runner writes its JIT profile and module cache. The MLX
        # tests that run pwsh allow 15 s, and a cold start under xdist load has exceeded it.
        run: pwsh -NoProfile -NonInteractive -Command '@{ ready = 1 } | ConvertTo-Json | Out-Null'

      - name: Run complete test suite
        # The default xdist scheduler hands each worker a fixed run of consecutive
        # tests, so the worker that drew the slow ones finished minutes after the
        # rest. Work stealing moves queued tests to whichever worker runs dry.
        run: |
          mkdir -p build/reports
          python -m pytest tests demos/integrations \
            -p tools.pytest_shard --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --durations=25 -n auto --dist worksteal --junitxml build/reports/full-tests-pytest.xml

      - name: Write complete test failure summary
        if: always()
        run: |
          python tools/pytest_failure_summary.py \
            build/reports/full-tests-pytest.xml \
            --json-output build/reports/full-tests-failure-summary.json \
            --markdown-output build/reports/full-tests-failure-summary.md
          cat build/reports/full-tests-failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete test failure summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: full-test-failure-summary-${{ matrix.shard }}
          path: |
            build/reports/full-tests-pytest.xml
            build/reports/full-tests-failure-summary.json
            build/reports/full-tests-failure-summary.md
          if-no-files-found: ignore
          retention-days: 14

  shader-validators:
    name: Shader Validators (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install optional shader validators
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-shader-validators

      - name: Install GLSL validator (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang

      - name: Install WGSL validator (macOS)
        if: runner.os == 'macOS'
        run: brew install naga-cli

      - name: Install GLSL validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $vulkanSdkVersion = "1.4.341.1"
          $maxAttempts = 3
          $chocoInstalled = $false
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install vulkan-sdk --version=1.4.341 -y --no-progress
            if ($LASTEXITCODE -eq 0) {
              $chocoInstalled = $true
              break
            }
            if ($attempt -eq $maxAttempts) {
              break
            }
            Write-Warning "Chocolatey Vulkan SDK install failed on attempt $attempt; retrying."
            Start-Sleep -Seconds (20 * $attempt)
          }
          if (-not $chocoInstalled) {
            $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$vulkanSdkVersion.exe"
            $installRoot = "C:\VulkanSDK\$vulkanSdkVersion"
            $sdkUri = "https://sdk.lunarg.com/sdk/download/$vulkanSdkVersion/windows/vulkansdk-windows-X64-$vulkanSdkVersion.exe"
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Invoke-WebRequest -Uri $sdkUri -OutFile $installer
                & $installer --root $installRoot --accept-licenses --default-answer --confirm-command install copy_only=1
                if ($LASTEXITCODE -ne 0) {
                  throw "Vulkan SDK installer exited with code $LASTEXITCODE"
                }
                break
              } catch {
                if ($attempt -eq $maxAttempts) {
                  throw
                }
                Write-Warning "Direct Vulkan SDK install failed on attempt $attempt; retrying."
                Start-Sleep -Seconds (20 * $attempt)
              }
            }
          }
          $sdkRoot = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $sdkRoot) {
            throw "Vulkan SDK install directory was not found"
          }
          Join-Path $sdkRoot.FullName "Bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install DirectX Shader Compiler (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-dxc

      - name: Install DirectX Shader Compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc"
          $dxcUri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/dxc_2026_02_20.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $dxcUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "DXC download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          Expand-Archive -Path $archive -DestinationPath $dxcRoot -Force
          Join-Path $dxcRoot "bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run external shader validator tests
        shell: bash
        run: |
          mkdir -p build/reports
          python -m pytest \
            tests/test_translator/test_codegen/test_external_shader_validators.py \
            --junitxml build/reports/shader-validators-pytest.xml \
            -rs

      - name: Write shader validator failure summary
        if: always()
        shell: bash
        run: |
          python tools/pytest_failure_summary.py \
            build/reports/shader-validators-pytest.xml \
            --json-output build/reports/shader-validators-failure-summary.json \
            --markdown-output build/reports/shader-validators-failure-summary.md
          cat build/reports/shader-validators-failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shader validator failure summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shader-validator-failure-summary-${{ matrix.os }}
          path: |
            build/reports/shader-validators-pytest.xml
            build/reports/shader-validators-failure-summary.json
            build/reports/shader-validators-failure-summary.md
          if-no-files-found: ignore
          retention-days: 30

  runtime-parity:
    name: Runtime Parity (${{ matrix.adapter }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            adapter: opengl
            required_tools: glslangValidator
            apt_packages: glslang-tools libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri mesa-utils
          - os: ubuntu-latest
            adapter: vulkan
            required_tools: spirv-val,spirv-as
            apt_packages: glslang-tools libvulkan1 mesa-vulkan-drivers spirv-tools vulkan-tools
          - os: macOS-latest
            adapter: metal
            required_tools: xcrun
          - os: windows-latest
            adapter: directx
            required_tools: dxc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      # The packages.microsoft.com sources on hosted runners are not needed here, and apt-get update fails when that
      # repository is unavailable.
      - name: Remove optional hosted-runner apt sources
        if: matrix.apt_packages
        run: |
          { grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -fv

      - name: Install adapter toolchain
        if: matrix.apt_packages
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.apt_packages }}

      - name: Check the Metal compiler
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx -f metal

      - name: Probe runtime parity adapter availability
        id: probe_runtime_parity
        shell: bash
        env:
          RUNTIME_PARITY_ADAPTER: ${{ matrix.adapter }}
          RUNTIME_PARITY_REQUIRED_TOOLS: ${{ matrix.required_tools }}
        run: |
          python - <<'PY'
          import os
          import shutil

          adapter = os.environ["RUNTIME_PARITY_ADAPTER"]
          required_tools = [
              tool
              for tool in os.environ["RUNTIME_PARITY_REQUIRED_TOOLS"].split(",")
              if tool
          ]
          missing = [tool for tool in required_tools if shutil.which(tool) is None]
          available = "false" if missing else "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"available={available}\n")
              output.write(f"missing={','.join(missing)}\n")
          if missing:
              print(
                  f"Runtime parity adapter unavailable for {adapter}: "
                  + ", ".join(missing)
              )
          else:
              print(f"Runtime parity adapter available for {adapter}")
          PY

      - name: Install dependencies
        if: steps.probe_runtime_parity.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install optional Vulkan runtime dependency
        if: matrix.adapter == 'vulkan' && steps.probe_runtime_parity.outputs.available == 'true'
        run: |
          python -m pip install vulkan==1.3.275.1

      - name: Install OpenGL runtime dependency
        if: matrix.adapter == 'opengl' && steps.probe_runtime_parity.outputs.available == 'true'
        run: |
          python -m pip install "moderngl>=5.10,<6"

      - name: Run runtime parity tests
        if: steps.probe_runtime_parity.outputs.available == 'true'
        shell: bash
        env:
          RUNTIME_PARITY_ADAPTER: ${{ matrix.adapter }}
        run: |
          mkdir -p build/reports
          if [ "$RUNTIME_PARITY_ADAPTER" = "vulkan" ]; then
            export CROSTL_RUN_VULKAN_DEVICE_TEST=1
            vulkaninfo --summary || true
          fi
          python -m pytest -q \
            tests/test_translator/test_runtime_verification.py \
            tests/test_translator/test_native_runtime_drivers.py \
            -k "runtime_parity" \
            --junitxml build/reports/runtime-parity-${{ matrix.adapter }}-${{ matrix.os }}.xml

      - name: Run OpenGL compute runtime test
        if: matrix.adapter == 'opengl' && steps.probe_runtime_parity.outputs.available == 'true'
        shell: bash
        env:
          CROSTL_RUN_OPENGL_DEVICE_TEST: "1"
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python -m pytest -q \
            tests/test_translator/test_native_runtime_drivers.py \
            -k "opengl_compute_runtime_executes_vector_scale_on_device"

      - name: Check HLSL evaluation semantics on the native driver
        if: (matrix.adapter == 'opengl' || matrix.adapter == 'metal') && steps.probe_runtime_parity.outputs.available == 'true'
        shell: bash
        env:
          CROSSTL_REQUIRE_HLSL_VALUE_ARRAY_EXECUTION: "1"
          CROSSTL_REQUIRE_BUFFER_COUNTER_EXECUTION: "1"
          CROSSTL_REQUIRE_MESA_NIR_EXACTNESS: ${{ matrix.adapter == 'opengl' && '1' || '' }}
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python -m pytest -q \
            tests/test_backend/test_directx/test_hlsl_value_array_parameters.py \
            tests/test_backend/test_directx/test_hlsl_precise_arithmetic.py \
            tests/test_translator/test_structured_buffer_counters.py

      - name: Record unavailable runtime parity adapter
        if: steps.probe_runtime_parity.outputs.available != 'true'
        shell: bash
        run: |
          {
            echo "## Runtime Parity Adapter Skipped"
            echo "- Adapter: ${{ matrix.adapter }}"
            echo "- OS: ${{ matrix.os }}"
            echo "- Missing tools: ${{ steps.probe_runtime_parity.outputs.missing }}"
          } >> "$GITHUB_STEP_SUMMARY"

  directx-native-runtime-smoke:
    name: Direct3D 12 Native Runtime Smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install DirectX Shader Compiler
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $archive = Join-Path $env:RUNNER_TEMP "dxc.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc"
          $dxcUri = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/dxc_2026_02_20.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $dxcUri -OutFile $archive
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }
              Write-Warning "DXC download failed on attempt $attempt; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          Expand-Archive -Path $archive -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem -Path $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match "\\bin\\x64\\dxc.exe$" } |
            Select-Object -First 1
          if ($null -eq $dxc) {
            throw "dxc.exe not found in release archive."
          }
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Direct3D runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[directx-runtime]"

      - name: Run native Direct3D runtime smoke test
        run: python tools/directx_runtime_smoke.py

  compiler-smoke-linux:
    name: Compiler Smoke (Linux CUDA/DXC/SPIR-V/Slang)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CUDA_VERSION: "13.2.0"
      SLANG_VERSION: v2026.9.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install GLSL and SPIR-V tools
        uses: ./.github/actions/install-shader-validators

      - name: Install DirectX Shader Compiler
        uses: ./.github/actions/install-linux-dxc

      - name: Install Slang compiler
        run: |
          set -euo pipefail
          version="${SLANG_VERSION#v}"
          archive="slang-${version}-linux-x86_64-glibc-2.27.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/${SLANG_VERSION}/${archive}"
          mkdir -p "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          slangc_path="$(find "$RUNNER_TEMP/slang" -type f -name slangc -perm -111 -print -quit)"
          if [ -z "$slangc_path" ]; then
            echo "slangc was not found in the extracted Slang archive" >&2
            find "$RUNNER_TEMP/slang" -maxdepth 3 -type f | sort >&2
            exit 1
          fi
          slang_bin="$(dirname "$slangc_path")"
          slang_lib="$(find "$RUNNER_TEMP/slang" -type d -name lib -print -quit)"
          echo "$slang_bin" >> "$GITHUB_PATH"
          if [ -n "$slang_lib" ]; then
            echo "LD_LIBRARY_PATH=$slang_lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi

      - name: Install CUDA compiler
        id: install_cuda
        continue-on-error: true
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          log-file-suffix: compiler-smoke-linux.txt

      - name: Reset CUDA apt metadata before retry
        if: steps.install_cuda.outcome == 'failure'
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/archive_uri-http_developer_download_nvidia_com_compute_cuda_repos_ubuntu2404_x86_64_-noble.list
          sudo rm -f /etc/apt/sources.list.d/cuda-ubuntu2404-x86_64.list
          sudo rm -rf /var/lib/apt/lists/*developer.download.nvidia.com*
          sleep 30

      - name: Retry CUDA compiler install after repository sync
        if: steps.install_cuda.outcome == 'failure'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          log-file-suffix: compiler-smoke-linux-retry.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify compiler toolchain is active
        run: |
          set -euo pipefail
          for tool in glslangValidator spirv-as spirv-val dxc slangc nvcc; do
            command -v "$tool"
          done
          glslangValidator --version
          spirv-as --version
          spirv-val --version
          dxc --version
          slangc -version || slangc --version
          nvcc --version

      - name: Run compiler toolchain smoke tests
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          cat > "$tmp/smoke.hlsl" <<'HLSL'
          struct PSInput {
            float4 position : SV_Position;
          };

          float4 PSMain(PSInput input) : SV_Target {
            return input.position;
          }
          HLSL
          dxc -T ps_6_0 -E PSMain "$tmp/smoke.hlsl" -Fo "$tmp/smoke.dxil"

          cat > "$tmp/smoke.slang" <<'SLANG'
          [shader("compute")]
          [numthreads(1, 1, 1)]
          void main(uint3 tid : SV_DispatchThreadID) {
          }
          SLANG
          slangc -target hlsl -entry main -stage compute "$tmp/smoke.slang" -o "$tmp/smoke.slang.hlsl"

          cat > "$tmp/smoke.comp" <<'GLSL'
          #version 450
          layout(local_size_x = 1, local_size_y = 1, local_size_z = 1) in;

          void main() {
          }
          GLSL
          glslangValidator -V "$tmp/smoke.comp" -o "$tmp/smoke.spv"
          spirv-val "$tmp/smoke.spv"

          cat > "$tmp/smoke.spvasm" <<'SPV'
          OpCapability Shader
          OpMemoryModel Logical GLSL450
          OpEntryPoint GLCompute %main "main"
          OpExecutionMode %main LocalSize 1 1 1
          %void = OpTypeVoid
          %fn = OpTypeFunction %void
          %main = OpFunction %void None %fn
          %entry = OpLabel
          OpReturn
          OpFunctionEnd
          SPV
          spirv-as "$tmp/smoke.spvasm" -o "$tmp/smoke-as.spv"
          spirv-val "$tmp/smoke-as.spv"

          cat > "$tmp/smoke.cu" <<'CUDA'
          #include <cuda_runtime.h>

          __global__ void cgl_smoke_kernel() {
          }
          CUDA
          nvcc -std=c++17 -c "$tmp/smoke.cu" -o "$tmp/smoke_cuda.o"

      - name: Run external shader validator tests
        run: |
          mkdir -p build/reports
          python -m pytest -q -n auto \
            tests/test_translator/test_codegen/test_external_shader_validators.py \
            tests/test_translator/test_preprocessor \
            --junitxml build/reports/compiler-smoke-linux-pytest.xml \
            -rs

      - name: Write compiler smoke failure summary
        if: always()
        run: |
          python tools/pytest_failure_summary.py \
            build/reports/compiler-smoke-linux-pytest.xml \
            --json-output build/reports/compiler-smoke-linux-failure-summary.json \
            --markdown-output build/reports/compiler-smoke-linux-failure-summary.md
          cat build/reports/compiler-smoke-linux-failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiler smoke failure summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: compiler-smoke-linux-failure-summary
          path: |
            build/reports/compiler-smoke-linux-pytest.xml
            build/reports/compiler-smoke-linux-failure-summary.json
            build/reports/compiler-smoke-linux-failure-summary.md
          if-no-files-found: ignore
          retention-days: 30

  compiler-smoke-macos:
    name: Compiler Smoke (macOS Metal)
    runs-on: macOS-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"

      - name: Install GLSL validator
        run: brew install glslang

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify Metal toolchain is active
        run: |
          xcrun -sdk macosx -f metal
          xcrun -sdk macosx metal -v
          command -v glslangValidator
          glslangValidator --version

      - name: Run Metal compiler smoke tests
        run: |
          mkdir -p build/reports
          python -m pytest -q -n auto \
            tests/test_translator/test_codegen/test_external_shader_validators.py \
            tests/test_translator/test_codegen/test_shader_validation.py \
            tests/test_translator/test_codegen/test_metal_codegen.py \
            tests/test_translator/test_preprocessor/test_dialects.py \
            -k "metal" \
            --junitxml build/reports/compiler-smoke-macos-pytest.xml \
            -rs

      - name: Write Metal compiler smoke failure summary
        if: always()
        run: |
          python tools/pytest_failure_summary.py \
            build/reports/compiler-smoke-macos-pytest.xml \
            --json-output build/reports/compiler-smoke-macos-failure-summary.json \
            --markdown-output build/reports/compiler-smoke-macos-failure-summary.md
          cat build/reports/compiler-smoke-macos-failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Metal compiler smoke failure summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: compiler-smoke-macos-failure-summary
          path: |
            build/reports/compiler-smoke-macos-pytest.xml
            build/reports/compiler-smoke-macos-failure-summary.json
            build/reports/compiler-smoke-macos-failure-summary.md
          if-no-files-found: ignore
          retention-days: 30

  result:
    # The one check per workflow that branch protection and the merge queue require.
    name: Complete Test Suite result
    if: always()
    needs: [pytest, shader-validators, runtime-parity, directx-native-runtime-smoke, compiler-smoke-linux, compiler-smoke-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
