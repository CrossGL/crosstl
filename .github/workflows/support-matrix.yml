name: Support Matrix

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate support matrix
        run: python tools/support_matrix.py check --output support/generated/support-matrix-check.json

      - name: Audit support matrix evidence
        if: always()
        run: >
          python tools/support_matrix.py evidence
          --status supported
          --evidence missing
          --fail-on-missing
          --output support/generated/support-evidence-check.json

      - name: Upload support matrix check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: support-matrix-check-report
          path: |
            support/generated/support-matrix-check.json
            support/generated/support-evidence-check.json
          retention-days: 30

  docs-probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe backend documentation sources
        run: python tools/support_signals.py docs --output support/generated/backend-docs-report.json

      - name: Upload documentation probe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-docs-report
          path: support/generated/backend-docs-report.json
          retention-days: 30

  result:
    # The one check per workflow that branch protection and the merge queue require.
    name: Support Matrix result
    if: always()
    needs: [check, docs-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
