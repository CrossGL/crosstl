name: Pull request labels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Open pull requests without labels get the labels whose `paths` in .github/labels.yml match their files
# (tools/labels.py). The job runs main's code and reads only file names through the API, so it can hold a write token
# for pull requests from forks too. It runs when a pull request's Coverage run is requested, which every push to a
# pull request does, so a new pull request is labelled within minutes. It also runs on every push to main, and hourly
# as a backstop, since GitHub starts scheduled runs on this repository hours late. Runs share one concurrency group:
# the newest waits for the running one and the others are dropped. Coverage runs in the merge queue start no run,
# since a queue rebuild would start one per group and they would drop the pending run of a pull request.
on:
  workflow_run:
    workflows: [Coverage]
    types: [requested]
    branches-ignore: ["gh-readonly-queue/**"]
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-labels
  cancel-in-progress: false

jobs:
  label:
    name: Label pull requests
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "PyYAML>=6,<7"
      - name: Label pull requests from their paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.labels --repo "$GITHUB_REPOSITORY" --pull-requests --apply
