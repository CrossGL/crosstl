name: Labels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Pull requests that touch the label set print the changes; pushes to main make them. Every hour, open pull requests
# without labels get the labels whose `paths` in .github/labels.yml match their files. That job runs main's code and
# reads only file names through the API, so it can hold a write token for pull requests from forks too.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - tools/labels.py
  pull_request:
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
      - tools/labels.py
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan label changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "PyYAML>=6,<7"
      - name: Print label changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.labels --repo "$GITHUB_REPOSITORY"
      - name: Print pull request labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.labels --repo "$GITHUB_REPOSITORY" --pull-requests

  sync:
    name: Sync labels
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "PyYAML>=6,<7"
      - name: Apply label changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.labels --repo "$GITHUB_REPOSITORY" --apply

  pull-requests:
    name: Label pull requests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "PyYAML>=6,<7"
      - name: Label pull requests from their paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.labels --repo "$GITHUB_REPOSITORY" --pull-requests --apply
