name: Coverage

# Measures what CrossTL supports per backend and direction (tools/coverage). Every feature in the pinned upstream
# feature lists gets a generated probe, which CrossTL translates and the target's reference tool validates. The
# Linux job measures GLSL, WebGL (GLSL ES 3.00), HLSL, SPIR-V, WGSL and Slang with glslang, DXC, spirv-val, naga
# and slangc. Three more Linux jobs measure CUDA, HIP and Mojo with nvcc, hipcc and the Mojo compiler, one measures
# Rust with rust-gpu, and the macOS job measures Metal with xcrun metal. The report job merges the reports and adds
# the CrossGL IR row. On pushes to main and nightly, the publish job replaces the orphan `coverage` branch with
# coverage.json, coverage.svg (the README chart), COVERAGE.md, a bounded history.csv and trend.svg, the trend chart
# drawn from it; main itself never receives generated files. The issues job then reconciles the tracking and bug issues
# (tools/coverage/issues.py); pull requests only print its plan, and the comment job posts their change against
# main on the pull request.
#
# Coverage is reported, not enforced: a gap or a wrong result becomes an issue, never a failed check. The jobs fail
# only when the engine itself breaks or a reference tool is missing. Pull requests and the merge queue run the Metal,
# CUDA/HIP/Mojo and Rust jobs only when they change the coverage engine or that backend's translator; the job summary
# names the rows a run left out. Pushes to main and the nightly run measure everything.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "0"
  NAGA_VERSION: "30.0.1"
  SLANG_VERSION: "2026.9.1"
  # tools/coverage/upstream.py reads spirv_std from the same release.
  RUST_GPU_VERSION: "0.11.0"
  RUST_GPU_COMMIT: "62401280ab4b512c734ad1aceee7553385e17418"

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    # Clear of the conformance, corpus and MLX nightly runs, which share the runners.
    - cron: "53 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan coverage legs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      metal: ${{ steps.plan.outputs.metal }}
      compute: ${{ steps.plan.outputs.compute }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Decide which optional legs run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          legs=(metal compute rust)
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            for leg in "${legs[@]}"; do echo "$leg=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          # A pull request checks out its merge commit and a merge group its queued commit; the first parent is the
          # base, so this lists exactly the files the change touches.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          engine='tools/coverage/|tests/coverage/|\.github/workflows/coverage\.yml$'
          declare -A paths=(
            [metal]='crosstl/translator/codegen/metal|crosstl/backend/Metal/|tools/ensure_metal_toolchain\.py$'
            [compute]='crosstl/translator/codegen/(cuda|hip|mojo)_|crosstl/backend/(CUDA|HIP|Mojo)/'
            [rust]='crosstl/translator/codegen/rust_|crosstl/backend/Rust/'
          )
          for leg in "${legs[@]}"; do
            if grep -Eq "^($engine|${paths[$leg]})" <<<"$changed"; then
              echo "$leg=true" >> "$GITHUB_OUTPUT"
            else
              echo "$leg=false" >> "$GITHUB_OUTPUT"
            fi
          done

  linux:
    name: Coverage (GLSL, WebGL, HLSL, SPIR-V, WGSL, Slang)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install pinned Linux DXC
        uses: ./.github/actions/install-linux-dxc
        with:
          pinned: "true"

      - name: Install pinned glslang and SPIRV-Tools
        uses: ./.github/actions/install-shader-validators

      - name: Restore naga
        id: naga
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build naga
        if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked --root "$RUNNER_TEMP/naga"

      - name: Activate naga
        run: |
          echo "$RUNNER_TEMP/naga/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/naga/bin/naga" --version

      # The release tools/coverage/upstream.py reads Slang's standard library from; the archive digest is pinned.
      - name: Install slangc ${{ env.SLANG_VERSION }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/slang.tar.gz"
          curl -fsSLo "$archive" --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz"
          echo "b57ea8869aa6d61a449145a8048591fdd9311c478496f012bbd2440e31ea0130  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/slang"
          tar -xzf "$archive" -C "$RUNNER_TEMP/slang"
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/slang/bin/slangc" -version

      - name: Restore upstream feature sources
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/coverage-cache
          key: coverage-upstream-linux-${{ hashFiles('tools/coverage/upstream.py') }}

      - name: Measure coverage
        env:
          CROSSTL_COVERAGE_CACHE: ${{ runner.temp }}/coverage-cache
        run: |
          python -m tools.coverage run --strict --jobs 4 \
            --backend glsl --backend webgl --backend hlsl --backend spirv --backend wgsl --backend slang \
            --output coverage-linux.json

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: coverage-linux.json
          retention-days: 14

  # One leg per language: each compiles four probes per feature, and together they would outlast a job's timeout.
  compute:
    name: Coverage (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.compute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            name: CUDA
          - backend: hip
            name: HIP
          - backend: mojo
            name: Mojo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # nvcc compiles without a GPU, so the CUDA compiler and runtime headers are all the probes need.
      - name: Install nvcc 13.0
        if: matrix.backend == 'cuda'
        run: |
          set -euo pipefail
          keyring="$RUNNER_TEMP/cuda-keyring.deb"
          curl -fsSLo "$keyring" --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          echo "d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba  $keyring" | sha256sum --check --strict
          sudo dpkg -i "$keyring"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cuda-nvcc-13-0=13.0.88-1 cuda-crt-13-0=13.0.88-1 cuda-cudart-dev-13-0=13.0.96-1
          echo /usr/local/cuda-13.0/bin >> "$GITHUB_PATH"
          /usr/local/cuda-13.0/bin/nvcc --version

      # hipcc 5.7.1 and its clang 17 come from Ubuntu's archive, the versions tools/coverage/upstream.py pins the HIP
      # headers to. It compiles for a named AMD target, so no GPU is needed either.
      - name: Install hipcc 5.7.1
        if: matrix.backend == 'hip'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends hipcc=5.7.1-3 libamdhip64-dev=5.7.1-3
          hipcc --version

      # The Mojo compiler and MAX's GPU package, at the release tools/coverage/upstream.py reads Mojo's standard library
      # from. They live in their own environment, and the wheels are pinned by digest.
      - name: Install mojo 1.1.0
        if: matrix.backend == 'mojo'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mojo"
          cat > "$RUNNER_TEMP/mojo-requirements.txt" <<'EOF'
          mojo-compiler==1.1.0 --hash=sha256:b47442278eb39705075f23d058b38a364bd68bdaa542ad514c187cee633beab7
          mojo-compiler-mojo-libs==1.1.0 --hash=sha256:dd8c5382e27fe5c1ffe0834d267f549abbffee35bf1a8d605cf24252ff95a2e6
          max-mojo-libs==26.6.0 --hash=sha256:7880630afbfb544bd66cf7ab725f5e7b91fcaac02c7e4c9a74a877eba1546e2b
          EOF
          "$RUNNER_TEMP/mojo/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/mojo-requirements.txt"
          echo "CROSSTL_COVERAGE_MOJO=$RUNNER_TEMP/mojo/bin/mojo" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mojo/bin/mojo" --version

      - name: Restore upstream feature sources
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/coverage-cache
          key: coverage-upstream-${{ matrix.backend }}-${{ hashFiles('tools/coverage/upstream.py') }}

      - name: Measure coverage
        env:
          CROSSTL_COVERAGE_CACHE: ${{ runner.temp }}/coverage-cache
          BACKEND: ${{ matrix.backend }}
        run: python -m tools.coverage run --strict --jobs 4 --backend "$BACKEND" --output "coverage-$BACKEND.json"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.backend }}
          path: coverage-${{ matrix.backend }}.json
          retention-days: 14

  rust:
    name: Coverage (Rust)
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # spirv-dis disassembles the module rust-gpu emits, which places each Rust feature in the SPIR-V semantic
      # universe the CrossGL IR row is measured against.
      - name: Install pinned glslang and SPIRV-Tools
        uses: ./.github/actions/install-shader-validators

      # rust-gpu is a rustc backend built from source. The cache keeps the backend and the core and spirv-std
      # libraries rust-gpu's compile tests build for the SPIR-V target; tools/coverage/rustgpu.py compiles each probe
      # against them.
      - name: Restore rust-gpu
        id: rust-gpu
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rust-gpu
          key: rust-gpu-${{ env.RUST_GPU_COMMIT }}-${{ runner.os }}

      - name: Install rust-gpu ${{ env.RUST_GPU_VERSION }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rust-gpu"
          if [ ! -d "$root/.git" ]; then
            git clone --quiet --depth 1 --branch "v$RUST_GPU_VERSION" https://github.com/Rust-GPU/rust-gpu "$root"
          fi
          test "$(git -C "$root" rev-parse HEAD)" = "$RUST_GPU_COMMIT"
          cd "$root"
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustc-dev,llvm-tools
          if [ ! -f target/release/librustc_codegen_spirv.so ]; then
            cargo build --release -p rustc_codegen_spirv
            cargo run --release -p compiletests -- --target-env vulkan1.1 lang/core/intrinsics/log10
            # Keep only what a probe compiles against.
            find target/release -mindepth 1 -maxdepth 1 ! -name librustc_codegen_spirv.so -exec rm -rf {} +
            find target/compiletest-deps -type d -name incremental -prune -exec rm -rf {} +
            rm -rf target/compiletest-results
          fi
          du -sh "$root"

      - name: Restore upstream feature sources
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/coverage-cache
          key: coverage-upstream-rust-${{ hashFiles('tools/coverage/upstream.py') }}

      - name: Measure coverage
        env:
          CROSSTL_COVERAGE_CACHE: ${{ runner.temp }}/coverage-cache
          CROSSTL_COVERAGE_RUST_GPU: ${{ runner.temp }}/rust-gpu
        run: python -m tools.coverage run --strict --jobs 4 --backend rust --output coverage-rust.json

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: coverage-rust.json
          retention-days: 14

  metal:
    name: Coverage (Metal)
    needs: plan
    if: needs.plan.outputs.metal == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Prepare the Metal toolchain
        run: |
          xcodebuild -version
          python tools/ensure_metal_toolchain.py

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Measure coverage
        run: python -m tools.coverage run --strict --jobs 3 --backend metal --output coverage-metal.json

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-metal
          path: coverage-metal.json
          retention-days: 14

  report:
    name: Coverage report
    needs: [plan, linux, compute, rust, metal]
    # Every leg ran or was planned out; a leg is skipped only on pull requests and in the merge queue.
    if: >-
      always() && needs.plan.result == 'success' && needs.linux.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install CrossTL
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Merge the reports
        run: |
          set -euo pipefail
          python -m tools.coverage merge coverage-*.json --output coverage.json | tee summary.txt
          {
            echo "### Coverage"
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.json
          retention-days: 14

      # The coverage branch is public, so reading it needs no token.
      - name: Compare with the published coverage
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git fetch --quiet --depth=1 origin coverage && git show FETCH_HEAD:coverage.json > published.json; then
            python -m tools.coverage compare published.json coverage.json | tee compare.md
            { echo "### Change against main"; echo; cat compare.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No published coverage to compare with yet." | tee compare.md
          fi

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: coverage-change
          path: compare.md
          retention-days: 3

      # Pull requests and the merge queue only print what the issues job would change on main.
      - name: Plan the issue changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.coverage issues coverage.json --dry-run --repository "$GITHUB_REPOSITORY" | tee plan.txt
          {
            echo "### Issue changes on main"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Posts the change against main on the pull request, and edits that one comment on later pushes. The job runs no
  # code from the pull request; it only reads the report job's comparison as text. Fork pull requests get a read-only
  # token, so only same-repository pull requests get the comment; the report job's summary has it for every one.
  # `!cancelled()` replaces the implicit `success()`, which is false whenever a planned-out leg was skipped.
  comment:
    name: Comment the coverage change
    needs: report
    if: >-
      !cancelled() && github.event_name == 'pull_request' && needs.report.result == 'success'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-change

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- coverage-change -->"
          {
            echo "$marker"
            echo "### Coverage change against main"
            echo
            cat compare.md
            echo
            echo "Measured by [this Coverage run]($RUN_URL)."
          } > body.md
          comments="repos/$GITHUB_REPOSITORY/issues/$PR/comments"
          existing="$(gh api --paginate "$comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-change -->"))) | .id' | sed -n 1p)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@body.md > /dev/null
          else
            gh api --method POST "$comments" -F body=@body.md > /dev/null
          fi

  publish:
    name: Publish coverage
    needs: report
    # Pushes to main and the nightly run publish; pull requests and the merge queue only measure.
    if: >-
      !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that writes to the repository: it replaces the single commit of the orphan coverage branch.
    permissions:
      contents: write
    concurrency:
      group: coverage-publish
      cancel-in-progress: false
    outputs:
      published: ${{ steps.published.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Publishing needs only the standard library, so nothing is installed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Read the published coverage
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git fetch --quiet --depth=1 origin coverage; then
            echo "No coverage branch yet; this run creates it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show FETCH_HEAD:history.csv > previous-history.csv || true
          published="$(git show FETCH_HEAD:coverage.json | python -c 'import json, sys; print(json.load(sys.stdin)["commit"])' || true)"
          status=ahead
          if [ -n "$published" ] && [ "$published" != "$GITHUB_SHA" ]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$published...$GITHUB_SHA" --jq .status || echo ahead)"
          fi
          # A run that finishes after a run for a newer commit must not replace the newer data.
          if [ "$status" = behind ]; then
            echo "The coverage branch already holds $published, which is newer than $GITHUB_SHA."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the published files
        if: steps.published.outputs.publish == 'true'
        run: python -m tools.coverage publish coverage.json --history previous-history.csv --output-dir "$RUNNER_TEMP/site" --repository "$GITHUB_REPOSITORY"

      - name: Replace the coverage branch
        if: steps.published.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          git init --quiet --initial-branch=coverage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json coverage.svg COVERAGE.md history.csv trend.svg
          git commit --quiet -m "Coverage for ${GITHUB_SHA::12}"
          # The branch is one commit by design, so each publication replaces it.
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:coverage
          echo "Published https://github.com/${GITHUB_REPOSITORY}/blob/coverage/COVERAGE.md" >> "$GITHUB_STEP_SUMMARY"

  issues:
    name: Reconcile coverage issues
    needs: publish
    # Runs only after this run's results were published, so issues never fall back to older data.
    if: "!cancelled() && needs.publish.outputs.published == 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: coverage-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reconciling needs only the standard library and gh, so nothing is installed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Update the tracking and bug issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.coverage issues coverage.json --repository "$GITHUB_REPOSITORY" | tee changes.txt
          {
            echo "### Issue changes"
            echo
            echo '```'
            cat changes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  result:
    name: Coverage result
    needs: [plan, linux, compute, rust, metal, report, comment, publish, issues]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check coverage jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A coverage job ended with $result."; exit 1 ;;
            esac
          done
